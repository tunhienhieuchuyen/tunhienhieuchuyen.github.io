  :root {
    --bg: #f4efe6;
    --surface: #fffdf8;
    --ink: #1c1917;
    --muted: #5c564e;
    --line: #e4dcd0;
    --teal: #0f5c56;
    --teal-fg: #f7f3eb;
    --clay: #9c3b2e;
    --clay-soft: #f8ebe6;
    --cream: #f7f1e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Be Vietnam Pro", "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    min-height: 100dvh;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: transparent; }
  button:disabled { cursor: default; }
  #app { max-width: 32rem; margin: 0 auto; padding: 1.15rem 1rem 6.5rem; }
  #app.solo { padding-bottom: 1.5rem; }
  h1 { font-size: 1.55rem; line-height: 1.2; margin: 0.2rem 0 0; }
  h2 { font-size: 1.15rem; line-height: 1.3; margin: 0.15rem 0 0; }
  p { margin: 0; }
  .kicker { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; color: var(--teal); }
  .muted { color: var(--muted); }
  .clay { color: var(--clay); }
  .teal { color: var(--teal); }
  .sm { font-size: 0.92rem; }
  .xs { font-size: 0.78rem; }
  .stack { display: flex; flex-direction: column; gap: 0.85rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; }
  .banner { background: var(--clay-soft); color: var(--clay); border: 1px solid var(--line); border-radius: 1rem; padding: 0.8rem 1rem; }
  .hero-teal, .hero-clay { color: var(--teal-fg); border-radius: 1rem; padding: 1rem; }
  .hero-teal { background: var(--teal); }
  .hero-clay { background: var(--clay); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .stat { text-align: center; padding: 0.7rem 0.3rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    min-height: 3rem; width: 100%; border-radius: 999px; padding: 0 1rem;
    font-weight: 600; font-size: 0.95rem;
  }

du lịch nổi tiếng.","note":""},{"en":"attraction","ipa":"/əˈtrækʃn/","pos":"n","vi":"điểm thu hút; sự thu hút","ex":"The night market is the main attraction.","exVi":"Chợ đêm là điểm thu hút chính.","note":""},{"en":"preserve","ipa":"/prɪˈzɜːv/","pos":"v","vi":"bảo tồn, gìn giữ","ex":"We must preserve traditional crafts.","exVi":"Chúng ta phải gìn giữ nghề thủ công truyền thống.","note":""},{"en":"original","ipa":"/əˈrɪdʒənl/","pos":"adj","vi":"nguyên bản, ban đầu","ex":"This is the original family recipe.","exVi":"Đây là công thức nguyên bản của gia đình.","note":""},{"en":"fragrance","ipa":"/ˈfreɪɡrəns/","pos":"n","vi":"hương thơm","ex":"The fragrance of incense fills the pagoda.","exVi":"Hương thơm của nhang lan khắp chùa.","note":""},{"en":"function","ipa":"/ˈfʌŋkʃn/","pos":"n","vi":"chức năng, công dụng","ex":"The function of this tool is to cut silk threads.","exVi":"Công dụng của dụng cụ này là cắt sợi tơ.","note":""},{"en":"generation","ipa":"/ˌdʒenəˈreɪʃn/","pos":"n","vi":"thế hệ","ex":"The skill passes from generation to generation.","exVi":"Kỹ năng được truyền từ thế hệ này sang thế hệ khác.","note":""},{"en":"traditional","ipa":"/trəˈdɪʃənl/","pos":"adj","vi":"truyền thống","ex":"They still use a traditional technique.","exVi":"Họ vẫn dùng một kỹ thuật truyền thống.","note":""},{"en":"workshop","ipa":"/ˈwɜːkʃɒp/","pos":"n","vi":"xưởng (thủ công); buổi tập huấn","ex":"We watched the artisans in a small workshop.","exVi":"Chúng tôi xem các nghệ nhân làm việc trong một xưởng nhỏ.","note":""},{"en":"symbolise","ipa":"/ˈsɪmbəlaɪz/","pos":"v","vi":"tượng trưng cho. Anh-Mỹ viết symbolize","ex":"The conical hat symbolises Vietnamese culture.","exVi":"Nón lá tượng trưng cho văn hóa Việt Nam.","note":""},{"en":"souvenir","ipa":"/ˌsuːvəˈnɪə/","pos":"n","vi":"quà lưu niệm","ex":"I bought a pottery souvenir for my friend.","exVi":"Tôi mua một món quà lưu niệm bằng gốm cho bạn.","note":""},{"en":"cut down on","ipa":"/kʌt daʊn ɒn/","pos":"phr.v","vi":"cắt giảm","ex":"We should cut down on plastic bags.","exVi":"Chúng ta nên cắt giảm túi nilon.","note":""},{"en":"get on with","ipa":"/ɡet ɒn wɪð/","pos":"phr.v","vi":"hòa thuận với","ex":"She gets on well with her neighbours.","exVi":"Cô ấy hòa thuận với hàng xóm.","note":""},{"en":"hand down","ipa":"/hænd daʊn/","pos":"phr.v","vi":"truyền lại (cho đời sau)","ex":"They hand down the recipe to their children.","exVi":"Họ truyền lại công thức cho con cái.","note":""},{"en":"pass down","ipa":"/pɑːs daʊn/","pos":"phr.v","vi":"truyền lại","ex":"This story was passed down for many years.","exVi":"Câu chuyện này được truyền lại nhiều năm.","note":""},{"en":"look around","ipa":"/lʊk əˈraʊnd/","pos":"phr.v","vi":"nhìn ngắm xung quanh","ex":"Let's look around the craft village.","exVi":"Chúng ta hãy đi ngắm làng nghề.","note":""},{"en":"find out","ipa":"/faɪnd aʊt/","pos":"phr.v","vi":"tìm ra, phát hiện","ex":"I want to find out who made this vase.","exVi":"Tôi muốn tìm ra ai đã làm chiếc lọ này.","note":""},{"en":"run out of","ipa":"/rʌn aʊt əv/","pos":"phr.v","vi":"hết, cạn","ex":"The workshop ran out of bamboo.","exVi":"Xưởng đã hết tre.","note":""},{"en":"set up","ipa":"/set ʌp/","pos":"phr.v","vi":"thành lập, dựng lên","ex":"They set up a workshop for young artisans.","exVi":"Họ lập một xưởng cho nghệ nhân trẻ.","note":""},{"en":"take care of","ipa":"/teɪk keər əv/","pos":"phr.v","vi":"chăm sóc, trông nom","ex":"Volunteers take care of the village garden.","exVi":"Tình nguyện viên chăm sóc vườn của làng.","note":""},{"en":"come back","ipa":"/kʌm bæk/","pos":"phr.v","vi":"trở lại","ex":"Many visitors come back every year.","exVi":"Nhiều du khách trở lại mỗi năm.","note":""},{"en":"give advice","ipa":"/ɡɪv ədˈvaɪs/","pos":"cụm","vi":"đưa ra lời khuyên","ex":"The artisan gave us some advice about pottery.","exVi":"Nghệ nhân đã cho chúng tôi vài lời khuyên về đồ gốm.","note":"advice là danh từ không đếm được: không nói an advice hay advices."}]},{"id":"u2","part":2,"ky":1,"weeks":"3–5","unit":2,"titleVi":"Cuộc sống thành phố","titleEn":"City Life","kind":"unit","blurb":"Unit 2, Kỳ 1. Ngữ pháp: so sánh kép (The more..., the more...) và cụm động từ. Tuần 3 bắt đầu bài khi Unit 1 kết thúc.","entries":[{"en":"bustling","ipa":"/ˈbʌslɪŋ/","pos":"adj","vi":"nhộn nhịp, náo nhiệt","ex":"The market is bustling early in the morning.","exVi":"Chợ nhộn nhịp từ sáng sớm.","note":""},{"en":"downtown","ipa":"/ˌdaʊnˈtaʊn/","pos":"n","vi":"trung tâm thành phố","ex":"We met downtown after school.","exVi":"Chúng tôi gặp nhau ở trung tâm sau giờ học.","note":""},{"en":"concrete jungle","ipa":"/ˌkɒŋkriːt ˈdʒʌŋɡl/","pos":"cụm","vi":"rừng bê tông: khu nhà cao tầng san sát","ex":"Some people call the city centre a concrete jungle.","exVi":"Một số người gọi trung tâm thành phố là rừng bê tông.","note":"Không dịch thành rừng thật."},{"en":"congested","ipa":"/kənˈdʒestɪd/","pos":"adj","vi":"tắc nghẽn","ex":"The main road is congested at seven o'clock.","exVi":"Đường chính tắc nghẽn lúc bảy giờ.","note":""},{"en":"congestion","ipa":"/kənˈdʒestʃən/","pos":"n","vi":"sự tắc nghẽn","ex":"Traffic congestion wastes a lot of time.","exVi":"Ùn tắc giao thông làm mất rất nhiều thời gian.","note":""},{"en":"construction","ipa":"/kənˈstrʌkʃn/","pos":"n","vi":"việc xây dựng; công trình","ex":"The construction of the metro takes many years.","exVi":"Việc xây tàu điện ngầm mất nhiều năm.","note":"construction chưa phải là công trường. Công trường là construction site."},{"en":"construction site","ipa":"/kənˈstrʌkʃn saɪt/","pos":"cụm","vi":"công trường xây dựng","ex":"Do not enter the construction site.","exVi":"Đừng đi vào công trường xây dựng.","note":""},{"en":"metro","ipa":"/ˈmetrəʊ/","pos":"n","vi":"tàu điện ngầm; hệ thống metro","ex":"I take the metro to school.","exVi":"Tôi đi học bằng tàu điện ngầm.","note":""},{"en":"underground","ipa":"/ˈʌndəɡraʊnd/","pos":"n","vi":"tàu điện ngầm (cách nói của tiếng Anh-Anh)","ex":"The underground is faster than the bus.","exVi":"Tàu điện ngầm nhanh hơn xe buýt.","note":""},{"en":"sky train","ipa":"/ˈskaɪ treɪn/","pos":"cụm","vi":"tàu điện trên cao","ex":"The sky train runs above the busy street.","exVi":"Tàu điện trên cao chạy phía trên con phố đông đúc.","note":""},{"en":"tram","ipa":"/træm/","pos":"n","vi":"tàu điện chạy trên đường phố","ex":"We went around the old town by tram.","exVi":"Chúng tôi đi vòng phố cổ bằng tàu điện.","note":""},{"en":"public transport","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","pos":"cụm","vi":"giao thông công cộng","ex":"Public transport is cheaper than a taxi.","exVi":"Giao thông công cộng rẻ hơn taxi.","note":""},{"en":"public amenities","ipa":"/ˌpʌblɪk əˈmiːnətiz/","pos":"cụm","vi":"tiện ích công cộng (công viên, thư viện, nhà vệ sinh công cộng...)","ex":"Parks and libraries are public amenities.","exVi":"Công viên và thư viện là tiện ích công cộng.","note":""},{"en":"rush hour","ipa":"/ˈrʌʃ aʊə/","pos":"cụm","vi":"giờ cao điểm","ex":"Avoid travelling in the rush hour if you can.","exVi":"Hãy tránh đi lại vào giờ cao điểm nếu có thể.","note":""},{"en":"skyscraper","ipa":"/ˈskaɪskreɪpə/","pos":"n","vi":"nhà chọc trời","ex":"That skyscraper has more than seventy floors.","exVi":"Tòa nhà chọc trời đó có hơn bảy mươi tầng.","note":""},{"en":"liveable","ipa":"/ˈlɪvəbl/","pos":"adj","vi":"đáng sống. Cách viết khác: livable","ex":"A city with parks is more liveable.","exVi":"Một thành phố có công viên thì đáng sống hơn.","note":""},{"en":"pricey","ipa":"/ˈpraɪsi/","pos":"adj","vi":"đắt đỏ","ex":"Flats downtown are very pricey.","exVi":"Căn hộ ở trung tâm rất đắt.","note":""},{"en":"affordable","ipa":"/əˈfɔːdəbl/","pos":"adj","vi":"có giá phải chăng","ex":"Students need affordable housing near school.","exVi":"Học sinh cần chỗ ở giá phải chăng gần trường.","note":""},{"en":"convenient","ipa":"/kənˈviːniənt/","pos":"adj","vi":"thuận tiện","ex":"The bus stop is convenient for students.","exVi":"Điểm xe buýt thuận tiện cho học sinh.","note":""},{"en":"reliable","ipa":"/rɪˈlaɪəbl/","pos":"adj","vi":"đáng tin cậy","ex":"The new metro is reliable and usually on time.","exVi":"Tàu điện mới đáng tin và thường đúng giờ.","note":""},{"en":"urban","ipa":"/ˈɜːbən/","pos":"adj","vi":"thuộc đô thị, thành thị","ex":"Urban life is fast and sometimes noisy.","exVi":"Đời sống đô thị nhanh và đôi khi ồn.","note":""},{"en":"resident","ipa":"/ˈrezɪdənt/","pos":"n","vi":"cư dân","ex":"Local residents want more green space.","exVi":"Cư dân địa phương muốn có thêm không gian xanh.","note":""},{"en":"infrastructure","ipa":"/ˈɪnfrəstrʌktʃə/","pos":"n","vi":"cơ sở hạ tầng","ex":"The city is improving its transport infrastructure.","exVi":"Thành phố đang cải thiện hạ tầng giao thông.","note":""},{"en":"drawback","ipa":"/ˈdrɔːbæk/","pos":"n","vi":"mặt hạn chế, nhược điểm","ex":"Noise is the main drawback of living downtown.","exVi":"Tiếng ồn là nhược điểm chính của việc sống ở trung tâm.","note":""},{"en":"vibrant","ipa":"/ˈvaɪbrənt/","pos":"adj","vi":"sôi động","ex":"The night market is vibrant at the weekend.","exVi":"Chợ đêm rất sôi động vào cuối tuần.","note":""},{"en":"multicultural","ipa":"/ˌmʌltiˈkʌltʃərəl/","pos":"adj","vi":"đa văn hóa","ex":"It is a multicultural city with food from many countries.","exVi":"Đó là một thành phố đa văn hóa với món ăn từ nhiều nước.","note":""},{"en":"cost of living","ipa":"/ˌkɒst əv ˈlɪvɪŋ/","pos":"cụm","vi":"chi phí sinh hoạt","ex":"The cost of living downtown is high.","exVi":"Chi phí sinh hoạt ở trung tâm cao.","note":""},{"en":"pollution","ipa":"/pəˈluːʃn/","pos":"n","vi":"sự ô nhiễm","ex":"Air pollution is a serious city problem.","exVi":"Ô nhiễm không khí là vấn đề nghiêm trọng của thành phố.","note":""},{"en":"hygiene","ipa":"/ˈhaɪdʒiːn/","pos":"n","vi":"vệ sinh","ex":"Street food must meet basic hygiene rules.","exVi":"Đồ ăn đường phố phải đạt quy tắc vệ sinh cơ bản.","note":""},{"en":"leftover","ipa":"/ˈleftəʊvə/","pos":"n","vi":"thức ăn thừa","ex":"Do not throw leftover food on the street.","exVi":"Đừng vứt thức ăn thừa ra đường.","note":""},{"en":"itchy","ipa":"/ˈɪtʃi/","pos":"adj","vi":"ngứa","ex":"Dust from the road makes my eyes itchy.","exVi":"Bụi từ đường làm mắt tôi ngứa.","note":""},{"en":"process","ipa":"/ˈprəʊses/","pos":"v","vi":"xử lý","ex":"The city processes a huge amount of waste every day.","exVi":"Thành phố xử lý một lượng rác rất lớn mỗi ngày.","note":""},{"en":"carry out","ipa":"/ˈkæri aʊt/","pos":"phr.v","vi":"tiến hành, thực hiện","ex":"They carried out a survey about city traffic.","exVi":"Họ đã tiến hành một cuộc khảo sát về giao thông thành phố.","note":""},{"en":"get around","ipa":"/ɡet əˈraʊnd/","pos":"phr.v","vi":"đi lại, di chuyển","ex":"It is easy to get around the city by metro.","exVi":"Đi lại trong thành phố bằng tàu điện ngầm thì dễ.","note":""},{"en":"hang out with","ipa":"/hæŋ aʊt wɪð/","pos":"phr.v","vi":"đi chơi với","ex":"I hang out with my friends in the park.","exVi":"Tôi đi chơi với bạn ở công viên.","note":""},{"en":"come down with","ipa":"/kʌm daʊn wɪð/","pos":"phr.v","vi":"bị mắc (một bệnh)","ex":"He came down with a cold after the rain.","exVi":"Cậu ấy bị cảm sau trận mưa.","note":""},{"en":"pick somebody up","ipa":"/pɪk ˈsʌmbədi ʌp/","pos":"phr.v","vi":"đón ai bằng xe","ex":"My father picks me up after class.","exVi":"Bố đón tôi sau giờ học.","note":""}]},{"id":"u3","part":3,"ky":1,"weeks":"5–7","unit":3,"titleVi":"Sống khỏe cho tuổi teen","titleEn":"Healthy Living for Teens","kind":"unit","blurb":"Unit 3, Kỳ 1. Ngữ pháp: động từ khuyết thiếu trong câu điều kiện loại 1 (If you stay up late, you may feel tired). Tuần 8 là ôn giữa kỳ, không phải bài từ mới.","entries":[{"en":"physical","ipa":"/ˈfɪzɪkl/","pos":"adj","vi":"thuộc thể chất","ex":"Exercise improves your physical health.","exVi":"Tập luyện cải thiện sức khỏe thể chất.","note":""},{"en":"mental","ipa":"/ˈmentl/","pos":"adj","vi":"thuộc tinh thần, tâm trí","ex":"Sleep is important for mental health.","exVi":"Giấc ngủ quan trọng với sức khỏe tinh thần.","note":""},{"en":"well-balanced","ipa":"/ˌwel ˈbælənst/","pos":"adj","vi":"cân đối, điều độ","ex":"She tries to keep a well-balanced daily life.","exVi":"Cô ấy cố giữ một nếp sống điều độ.","note":""},{"en":"balanced diet","ipa":"/ˌbælənst ˈdaɪət/","pos":"cụm","vi":"chế độ ăn cân bằng","ex":"A balanced diet includes vegetables, fruit and protein.","exVi":"Chế độ ăn cân bằng gồm rau, trái cây và chất đạm.","note":""},{"en":"priority","ipa":"/praɪˈɒrəti/","pos":"n","vi":"việc ưu tiên; sự ưu tiên","ex":"Your health should be a priority before the exam.","exVi":"Sức khỏe nên là ưu tiên trước kỳ thi.","note":""},{"en":"counsellor","ipa":"/ˈkaʊnsələ/","pos":"n","vi":"người tư vấn, cố vấn. Anh-Mỹ viết counselor","ex":"The school counsellor listens to worried students.","exVi":"Cố vấn học đường lắng nghe những học sinh đang lo.","note":""},{"en":"helpline","ipa":"/ˈhelplaɪn/","pos":"n","vi":"đường dây hỗ trợ","ex":"Call a helpline if the stress feels too heavy.","exVi":"Hãy gọi đường dây hỗ trợ nếu căng thẳng quá nặng.","note":""},{"en":"anxiety","ipa":"/æŋˈzaɪəti/","pos":"n","vi":"sự lo lắng, lo âu","ex":"He feels anxiety before speaking in class.","exVi":"Cậu ấy thấy lo trước khi nói trước lớp.","note":""},{"en":"anxious","ipa":"/ˈæŋkʃəs/","pos":"adj","vi":"lo lắng","ex":"She is anxious about the maths test.","exVi":"Cô ấy lo về bài kiểm tra toán.","note":""},{"en":"stress","ipa":"/stres/","pos":"n","vi":"sự căng thẳng","ex":"Too much homework can cause stress.","exVi":"Quá nhiều bài tập có thể gây căng thẳng.","note":""},{"en":"stressed out","ipa":"/ˌstrest ˈaʊt/","pos":"adj","vi":"rất căng thẳng, kiệt sức vì lo","ex":"I feel stressed out the night before an exam.","exVi":"Tôi rất căng thẳng vào đêm trước kỳ thi.","note":""},{"en":"stressor","ipa":"/ˈstresə/","pos":"n","vi":"tác nhân gây căng thẳng","ex":"Noise is a common stressor for teenagers.","exVi":"Tiếng ồn là tác nhân gây căng thẳng thường gặp ở tuổi teen.","note":""},{"en":"pressure","ipa":"/ˈpreʃə/","pos":"n","vi":"áp lực","ex":"Exam pressure is common in grade 9.","exVi":"Áp lực thi cử rất thường gặp ở lớp 9.","note":""},{"en":"optimistic","ipa":"/ˌɒptɪˈmɪstɪk/","pos":"adj","vi":"lạc quan","ex":"Stay optimistic when a task looks difficult.","exVi":"Hãy lạc quan khi một việc trông khó.","note":""},{"en":"frustrated","ipa":"/ˈfrʌstreɪtɪd/","pos":"adj","vi":"bực bội, nản","ex":"He felt frustrated when he could not solve the exercise.","exVi":"Cậu ấy thấy nản khi không giải được bài tập.","note":""},{"en":"mood","ipa":"/muːd/","pos":"n","vi":"tâm trạng","ex":"A short walk can change your mood.","exVi":"Đi bộ một lát có thể đổi tâm trạng.","note":""},{"en":"distraction","ipa":"/dɪˈstrækʃn/","pos":"n","vi":"điều gây xao nhãng","ex":"The phone is a big distraction during revision.","exVi":"Điện thoại là thứ gây xao nhãng lớn khi ôn bài.","note":""},{"en":"additional","ipa":"/əˈdɪʃənl/","pos":"adj","vi":"thêm, bổ sung","ex":"She needs some additional rest this week.","exVi":"Tuần này cô ấy cần nghỉ ngơi thêm.","note":""},{"en":"appropriate","ipa":"/əˈprəʊpriət/","pos":"adj","vi":"phù hợp, thích đáng","ex":"Choose an appropriate snack before study time.","exVi":"Hãy chọn món ăn nhẹ phù hợp trước giờ học.","note":""},{"en":"appropriately","ipa":"/əˈprəʊpriətli/","pos":"adv","vi":"một cách phù hợp","ex":"Reply to the teacher appropriately and politely.","exVi":"Hãy trả lời thầy cô một cách phù hợp và lịch sự.","note":""},{"en":"fattening","ipa":"/ˈfætnɪŋ/","pos":"adj","vi":"gây tăng cân, gây béo","ex":"Too much fried food is fattening.","exVi":"Ăn quá nhiều đồ chiên thì dễ béo.","note":""},{"en":"junk food","ipa":"/ˈdʒʌŋk fuːd/","pos":"cụm","vi":"đồ ăn nhanh không lành mạnh","ex":"Eating junk food every day is bad for teens.","exVi":"Ăn đồ ăn nhanh mỗi ngày thì không tốt cho tuổi teen.","note":""},{"en":"accomplish","ipa":"/əˈkʌmplɪʃ/","pos":"v","vi":"hoàn thành, đạt được","ex":"She accomplished every task on her list.","exVi":"Cô ấy đã hoàn thành mọi việc trong danh sách.","note":""},{"en":"assignment","ipa":"/əˈsaɪnmənt/","pos":"n","vi":"bài tập được giao","ex":"Please finish the assignment before Friday.","exVi":"Hãy làm xong bài tập được giao trước thứ Sáu.","note":""},{"en":"deadline","ipa":"/ˈdedlaɪn/","pos":"n","vi":"hạn cuối","ex":"The deadline for the project is Monday.","exVi":"Hạn cuối của dự án là thứ Hai.","note":""},{"en":"due date","ipa":"/djuː deɪt/","pos":"cụm","vi":"ngày đến hạn phải nộp","ex":"Write the due date at the top of your paper.","exVi":"Hãy ghi ngày đến hạn ở đầu bài.","note":""},{"en":"minimise","ipa":"/ˈmɪnɪmaɪz/","pos":"v","vi":"giảm đến mức thấp nhất. Anh-Mỹ viết minimize","ex":"Minimise screen time in the hour before bed.","exVi":"Hãy giảm tối đa thời gian dùng màn hình trong giờ trước khi ngủ.","note":""},{"en":"delay","ipa":"/dɪˈleɪ/","pos":"v","vi":"trì hoãn","ex":"Do not delay your revision until the last night.","exVi":"Đừng trì hoãn việc ôn bài đến đêm cuối.","note":""},{"en":"manage","ipa":"/ˈmænɪdʒ/","pos":"v","vi":"xoay xở; quản lý được","ex":"He manages his time with a simple timetable.","exVi":"Cậu ấy xoay xở thời gian bằng một thời khóa biểu đơn giản.","note":""},{"en":"cope with","ipa":"/kəʊp wɪð/","pos":"phr.v","vi":"đương đầu với, ứng phó với","ex":"Exercise helps many teens cope with stress.","exVi":"Tập luyện giúp nhiều bạn trẻ đương đầu với căng thẳng.","note":""},{"en":"stay up","ipa":"/steɪ ʌp/","pos":"phr.v","vi":"thức (khuya), không đi ngủ","ex":"Do not stay up late before a test.","exVi":"Đừng thức khuya trước ngày kiểm tra.","note":""},{"en":"habit","ipa":"/ˈhæbɪt/","pos":"n","vi":"thói quen","ex":"Reading ten pages a day is a useful habit.","exVi":"Đọc mười trang mỗi ngày là một thói quen có ích.","note":""},{"en":"routine","ipa":"/ruːˈtiːn/","pos":"n","vi":"nếp sinh hoạt hằng ngày","ex":"A steady routine makes exam week easier.","exVi":"Một nếp sinh hoạt ổn định làm tuần thi dễ hơn.","note":""},{"en":"active","ipa":"/ˈæktɪv/","pos":"adj","vi":"năng động","ex":"Try to stay active for at least thirty minutes a day.","exVi":"Hãy năng động ít nhất ba mươi phút mỗi ngày.","note":""},{"en":"cognitive","ipa":"/ˈkɒɡnətɪv/","pos":"adj","vi":"thuộc nhận thức (trí nhớ, suy nghĩ)","ex":"Lack of sleep can harm cognitive skills such as memory.","exVi":"Thiếu ngủ có thể làm hại các kỹ năng nhận thức như trí nhớ.","note":""}]},{"id":"u4","part":4,"ky":1,"weeks":"9–11","unit":4,"titleVi":"Nhớ về quá khứ","titleEn":"Remembering the Past","kind":"unit","blurb":"Unit 4, Kỳ 1, sau tuần 8 ôn giữa kỳ. Ngữ pháp: quá khứ tiếp diễn và wish + quá khứ đơn (I wish I had more time then).","entries":[{"en":"ancient","ipa":"/ˈeɪnʃənt/","pos":"adj","vi":"cổ, cổ xưa","ex":"We visited an ancient temple in the old town.","exVi":"Chúng tôi đã thăm một ngôi đền cổ trong phố cổ.","note":""},{"en":"anniversary","ipa":"/ˌænɪˈvɜːsəri/","pos":"n","vi":"ngày kỷ niệm","ex":"Today is their fiftieth wedding anniversary.","exVi":"Hôm nay là kỷ niệm năm mươi năm ngày cưới của họ.","note":""},{"en":"barefoot","ipa":"/ˈbeəfʊt/","pos":"adj","vi":"chân trần","ex":"The children walked barefoot on the village path.","exVi":"Bọn trẻ đi chân trần trên lối làng.","note":""},{"en":"basic","ipa":"/ˈbeɪsɪk/","pos":"adj","vi":"cơ bản, đơn giản","ex":"The old house had only basic wooden furniture.","exVi":"Ngôi nhà cũ chỉ có đồ gỗ đơn giản.","note":""},{"en":"castle","ipa":"/ˈkɑːsl/","pos":"n","vi":"lâu đài","ex":"The stone castle is hundreds of years old.","exVi":"Lâu đài đá đã hàng trăm năm tuổi.","note":"Chữ t trong castle không đọc."},{"en":"communal","ipa":"/kəˈmjuːnl/","pos":"adj","vi":"dùng chung; thuộc cộng đồng","ex":"In the past, several families shared a communal kitchen.","exVi":"Ngày xưa nhiều gia đình dùng chung một bếp.","note":""},{"en":"complex","ipa":"/ˈkɒmpleks/","pos":"n","vi":"(danh từ) quần thể, khu nhiều công trình. (tính từ) phức tạp","ex":"The temple complex has several old buildings.","exVi":"Quần thể đền có nhiều công trình cũ.","note":"Trong bài, complex thường là danh từ: quần thể. Không chỉ học một nghĩa."},{"en":"deep-rooted","ipa":"/ˌdiːp ˈruːtɪd/","pos":"adj","vi":"ăn sâu, lâu đời","ex":"Respect for older people is a deep-rooted custom.","exVi":"Kính trọng người lớn tuổi là một phong tục ăn sâu.","note":""},{"en":"face to face","ipa":"/ˌfeɪs tə ˈfeɪs/","pos":"adv","vi":"trực tiếp, mặt đối mặt","ex":"They talked face to face instead of sending messages.","exVi":"Họ nói chuyện trực tiếp thay vì nhắn tin.","note":""},{"en":"monument","ipa":"/ˈmɒnjumənt/","pos":"n","vi":"tượng đài, công trình tưởng niệm","ex":"The monument honours the heroes of the village.","exVi":"Tượng đài tôn vinh các anh hùng của làng.","note":""},{"en":"heritage","ipa":"/ˈherɪtɪdʒ/","pos":"n","vi":"di sản","ex":"Hoi An Ancient Town is a world heritage site.","exVi":"Phố cổ Hội An là một di sản thế giới.","note":""},{"en":"historical","ipa":"/hɪˈstɒrɪkl/","pos":"adj","vi":"thuộc về lịch sử, có liên quan đến lịch sử","ex":"We watched a historical film about village life.","exVi":"Chúng tôi xem một bộ phim nói về đời sống làng xã trong lịch sử.","note":""},{"en":"historic","ipa":"/hɪˈstɒrɪk/","pos":"adj","vi":"có tầm quan trọng lịch sử","ex":"That year was a historic moment for the country.","exVi":"Năm đó là một thời khắc có tầm lịch sử của đất nước.","note":"historic = đáng nhớ trong lịch sử. historical = thuộc về lịch sử. Đừng đổi nghĩa cho nhau."},{"en":"magnificent","ipa":"/mæɡˈnɪfɪsnt/","pos":"adj","vi":"tráng lệ, nguy nga","ex":"The old palace looks magnificent at sunset.","exVi":"Cung điện cũ trông tráng lệ lúc hoàng hôn.","note":""},{"en":"well-preserved","ipa":"/ˌwel prɪˈzɜːvd/","pos":"adj","vi":"được gìn giữ tốt","ex":"The ancient houses are still well-preserved.","exVi":"Những ngôi nhà cổ vẫn được gìn giữ tốt.","note":""},{"en":"preserve","ipa":"/prɪˈzɜːv/","pos":"v","vi":"bảo tồn, gìn giữ","ex":"The city preserves its old quarter.","exVi":"Thành phố bảo tồn khu phố cũ.","note":""},{"en":"generation","ipa":"/ˌdʒenəˈreɪʃn/","pos":"n","vi":"thế hệ","ex":"Stories pass from one generation to the next.","exVi":"Những câu chuyện được truyền từ thế hệ này sang thế hệ sau.","note":""},{"en":"found","ipa":"/faʊnd/","pos":"v","vi":"thành lập","ex":"The school was founded in 1954.","exVi":"Trường được thành lập năm 1954.","note":"found – founded – founded = thành lập. Đừng nhầm với find – found – found = tìm thấy."},{"en":"occupy","ipa":"/ˈɒkjupaɪ/","pos":"v","vi":"ở, chiếm (một chỗ, một ngôi nhà)","ex":"The same family occupied the house for forty years.","exVi":"Cùng một gia đình ở ngôi nhà đó suốt bốn mươi năm.","note":""},{"en":"occupied","ipa":"/ˈɒkjupaɪd/","pos":"adj","vi":"có người ở; đang bận","ex":"That room is occupied, so please use the next one.","exVi":"Phòng đó có người ở rồi, xin dùng phòng bên.","note":""},{"en":"observe","ipa":"/əbˈzɜːv/","pos":"v","vi":"tuân theo, giữ (phong tục); cũng có nghĩa quan sát","ex":"They still observe Tet customs every year.","exVi":"Họ vẫn giữ phong tục Tết mỗi năm.","note":"Trong bài này observe a custom = giữ phong tục, không chỉ là nhìn."},{"en":"recognise","ipa":"/ˈrekəɡnaɪz/","pos":"v","vi":"công nhận; nhận ra. Anh-Mỹ viết recognize","ex":"UNESCO recognised the old town as world heritage.","exVi":"UNESCO đã công nhận phố cổ là di sản thế giới.","note":""},{"en":"promote","ipa":"/prəˈməʊt/","pos":"v","vi":"thúc đẩy, quảng bá","ex":"The festival promotes local culture.","exVi":"Lễ hội quảng bá văn hóa địa phương.","note":""},{"en":"contribute","ipa":"/kənˈtrɪbjuːt/","pos":"v","vi":"đóng góp","ex":"Every family contributed to the village festival.","exVi":"Mỗi gia đình đều đóng góp cho lễ hội của làng.","note":""},{"en":"religious","ipa":"/rɪˈlɪdʒəs/","pos":"adj","vi":"thuộc tôn giáo","ex":"It is an important religious festival.","exVi":"Đó là một lễ hội tôn giáo quan trọng.","note":""},{"en":"structure","ipa":"/ˈstrʌktʃə/","pos":"n","vi":"công trình; cấu trúc","ex":"The stone structure is still standing.","exVi":"Công trình đá vẫn còn đứng vững.","note":""},{"en":"thanks to","ipa":"/θæŋks tuː/","pos":"cụm","vi":"nhờ có, nhờ vào","ex":"Thanks to our grandparents, the custom is still alive.","exVi":"Nhờ ông bà mà phong tục vẫn còn.","note":""},{"en":"takeaway","ipa":"/ˈteɪkəweɪ/","pos":"n","vi":"đồ ăn mua mang về","ex":"In the past, people rarely bought takeaway food.","exVi":"Ngày xưa người ta hiếm khi mua đồ ăn mang về.","note":""},{"en":"fish and chips","ipa":"/ˌfɪʃ ən ˈtʃɪps/","pos":"cụm","vi":"cá và khoai tây chiên, món truyền thống của người Anh","ex":"Fish and chips is a traditional British dish.","exVi":"Cá và khoai tây chiên là món truyền thống của Anh.","note":"Cụm này coi như số ít: Fish and chips is..."},{"en":"act out","ipa":"/ækt aʊt/","pos":"phr.v","vi":"diễn lại, đóng vai","ex":"The students act out a story from the past.","exVi":"Học sinh diễn lại một câu chuyện ngày xưa.","note":""},{"en":"memory","ipa":"/ˈmeməri/","pos":"n","vi":"ký ức. Số nhiều memories","ex":"This old photo brings back a happy memory.","exVi":"Bức ảnh cũ gợi lại một ký ức vui.","note":""},{"en":"remind","ipa":"/rɪˈmaɪnd/","pos":"v","vi":"nhắc; làm ai nhớ đến","ex":"This song reminds me of my childhood.","exVi":"Bài hát này làm tôi nhớ tuổi thơ.","note":"remind somebody of something, hoặc remind somebody to V. Không nói remind to V nếu thiếu người được nhắc."},{"en":"childhood","ipa":"/ˈtʃaɪldhʊd/","pos":"n","vi":"thời thơ ấu","ex":"Her childhood was in a small village.","exVi":"Thời thơ ấu của bà ở một ngôi làng nhỏ.","note":""},{"en":"respect","ipa":"/rɪˈspekt/","pos":"v","vi":"tôn trọng. Cũng là danh từ: sự tôn trọng","ex":"We respect older people and learn from their stories.","exVi":"Chúng tôi tôn trọng người lớn tuổi và học từ câu chuyện của họ.","note":""},{"en":"elderly","ipa":"/ˈeldəli/","pos":"adj","vi":"cao tuổi. the elderly = những người cao tuổi","ex":"The elderly still remember life forty years ago.","exVi":"Người cao tuổi vẫn nhớ cuộc sống bốn mươi năm trước.","note":""},{"en":"pass on","ipa":"/pɑːs ɒn/","pos":"phr.v","vi":"truyền lại, kể tiếp","ex":"Grandparents pass on family stories to the children.","exVi":"Ông bà kể tiếp những câu chuyện gia đình cho trẻ.","note":""}]},{"id":"u5","part":5,"ky":1,"weeks":"11–13","unit":5,"titleVi":"Những trải nghiệm của chúng ta","titleEn":"Our Experiences","kind":"unit","blurb":"Unit 5, Kỳ 1. Trọng tâm thì hiện tại hoàn thành để kể trải nghiệm: already, ever, never, yet, just, since, for.","entries":[{"en":"experience","ipa":"/ɪkˈspɪəriəns/","pos":"n","vi":"trải nghiệm; kinh nghiệm. Động từ experience = trải qua","ex":"Camping in the forest was a new experience for me.","exVi":"Cắm trại trong rừng là một trải nghiệm mới với tôi.","note":""},{"en":"amazing","ipa":"/əˈmeɪzɪŋ/","pos":"adj","vi":"tuyệt vời; đáng kinh ngạc","ex":"The cave we visited was amazing.","exVi":"Hang động chúng tôi thăm thật đáng kinh ngạc.","note":"Không dịch thành chỉ là ngạc nhiên."},{"en":"brilliant","ipa":"/ˈbrɪliənt/","pos":"adj","vi":"xuất sắc; rất tuyệt","ex":"We had a brilliant time at the summer camp.","exVi":"Chúng tôi có khoảng thời gian rất tuyệt ở trại hè.","note":""},{"en":"exhilarating","ipa":"/ɪɡˈzɪləreɪtɪŋ/","pos":"adj","vi":"rất phấn khích, khiến người ta hứng khởi","ex":"The boat trip along the coast was exhilarating.","exVi":"Chuyến đi thuyền dọc bờ biển rất phấn khích.","note":""},{"en":"embarrassing","ipa":"/ɪmˈbærəsɪŋ/","pos":"adj","vi":"đáng xấu hổ, gây ngượng (nói về việc, tình huống)","ex":"Forgetting the words of the song was embarrassing.","exVi":"Quên lời bài hát thì thật ngượng.","note":""},{"en":"embarrassed","ipa":"/ɪmˈbærəst/","pos":"adj","vi":"thấy ngượng (nói về người)","ex":"I felt embarrassed when I forgot her name.","exVi":"Tôi thấy ngượng khi quên tên cô ấy.","note":"Người thì embarrassed. Việc thì embarrassing."},{"en":"confidence","ipa":"/ˈkɒnfɪdəns/","pos":"n","vi":"sự tự tin","ex":"The camp gave me more confidence in speaking.","exVi":"Chuyến trại giúp tôi tự tin hơn khi nói.","note":""},{"en":"confident","ipa":"/ˈkɒnfɪdənt/","pos":"adj","vi":"tự tin","ex":"She feels confident when she speaks English.","exVi":"Cô ấy thấy tự tin khi nói tiếng Anh.","note":""},{"en":"campus","ipa":"/ˈkæmpəs/","pos":"n","vi":"khuôn viên trường","ex":"The summer camp was held on a university campus.","exVi":"Trại hè được tổ chức trong khuôn viên một trường đại học.","note":""},{"en":"army-like","ipa":"/ˈɑːmi laɪk/","pos":"adj","vi":"theo kiểu quân đội, kỷ luật nghiêm như quân ngũ","ex":"The timetable was army-like: we got up at five.","exVi":"Thời khóa biểu nghiêm như quân đội: chúng tôi dậy lúc năm giờ.","note":""},{"en":"coral reef","ipa":"/ˈkɒrəl riːf/","pos":"cụm","vi":"rạn san hô","ex":"We were careful not to touch the coral reef.","exVi":"Chúng tôi cẩn thận không chạm vào rạn san hô.","note":""},{"en":"eco-tour","ipa":"/ˈiːkəʊ tʊə/","pos":"n","vi":"chuyến du lịch sinh thái","ex":"The eco-tour taught us how to protect the forest.","exVi":"Chuyến du lịch sinh thái dạy chúng tôi cách bảo vệ rừng.","note":""},{"en":"snorkelling","ipa":"/ˈsnɔːkəlɪŋ/","pos":"n","vi":"môn bơi có ống thở để ngắm dưới nước. Anh-Mỹ viết snorkeling","ex":"Snorkelling near the reef was the best part of the trip.","exVi":"Bơi ống thở gần rạn san hô là phần hay nhất của chuyến đi.","note":""},{"en":"memorable","ipa":"/ˈmemərəbl/","pos":"adj","vi":"đáng nhớ","ex":"It was a memorable week with my classmates.","exVi":"Đó là một tuần đáng nhớ với các bạn cùng lớp.","note":""},{"en":"unforgettable","ipa":"/ˌʌnfəˈɡetəbl/","pos":"adj","vi":"không thể quên","ex":"The sunrise on the mountain was unforgettable.","exVi":"Bình minh trên núi không thể quên được.","note":""},{"en":"adventure","ipa":"/ədˈventʃə/","pos":"n","vi":"cuộc phiêu lưu","ex":"The night trek became a real adventure.","exVi":"Chuyến đi bộ đêm thành một cuộc phiêu lưu thực sự.","note":""},{"en":"explore","ipa":"/ɪkˈsplɔː/","pos":"v","vi":"khám phá","ex":"We explored the old town on foot.","exVi":"Chúng tôi khám phá phố cổ bằng cách đi bộ.","note":""},{"en":"journey","ipa":"/ˈdʒɜːni/","pos":"n","vi":"hành trình, thường là chặng đi khá dài","ex":"The journey to the mountains took ten hours.","exVi":"Hành trình lên núi mất mười tiếng.","note":""},{"en":"trip","ipa":"/trɪp/","pos":"n","vi":"chuyến đi (thường đi và về)","ex":"Our school trip to Hue was last month.","exVi":"Chuyến đi của trường đến Huế là tháng trước.","note":"trip là một chuyến cụ thể. travel là việc đi du lịch nói chung."},{"en":"abroad","ipa":"/əˈbrɔːd/","pos":"adv","vi":"ở nước ngoài","ex":"She has never studied abroad.","exVi":"Cô ấy chưa từng học ở nước ngoài.","note":""},{"en":"volunteer","ipa":"/ˌvɒlənˈtɪə/","pos":"n","vi":"tình nguyện viên. Động từ: làm tình nguyện","ex":"We volunteered at a primary school in the village.","exVi":"Chúng tôi làm tình nguyện ở một trường tiểu học trong làng.","note":""},{"en":"skill","ipa":"/skɪl/","pos":"n","vi":"kỹ năng","ex":"Lighting a fire safely was a useful skill at camp.","exVi":"Nhóm lửa an toàn là một kỹ năng có ích ở trại.","note":""},{"en":"challenge","ipa":"/ˈtʃælɪndʒ/","pos":"n","vi":"thử thách","ex":"The hardest challenge was the long hike.","exVi":"Thử thách khó nhất là chặng đi bộ dài.","note":""},{"en":"achievement","ipa":"/əˈtʃiːvmənt/","pos":"n","vi":"thành tích; việc đạt được","ex":"Finishing the race was a great achievement.","exVi":"Về đích cuộc đua là một thành tích lớn.","note":""},{"en":"scared","ipa":"/skeəd/","pos":"adj","vi":"sợ","ex":"I was scared of the dark cave at first.","exVi":"Lúc đầu tôi sợ hang tối.","note":""},{"en":"excited","ipa":"/ɪkˈsaɪtɪd/","pos":"adj","vi":"hào hứng (cảm xúc của người)","ex":"I am excited about the school trip.","exVi":"Tôi hào hứng về chuyến đi của trường.","note":""},{"en":"exciting","ipa":"/ɪkˈsaɪtɪŋ/","pos":"adj","vi":"thú vị, gây hào hứng (nói về việc)","ex":"The boat trip was exciting.","exVi":"Chuyến đi thuyền rất thú vị.","note":"Người excited. Việc exciting."},{"en":"already","ipa":"/ɔːlˈredi/","pos":"adv","vi":"đã... rồi (thường với hiện tại hoàn thành)","ex":"I have already visited Hue.","exVi":"Tôi đã đến Huế rồi.","note":""},{"en":"ever","ipa":"/ˈevə/","pos":"adv","vi":"đã từng, trong câu hỏi hoặc câu phủ định","ex":"Have you ever tried snorkelling?","exVi":"Bạn đã từng thử bơi ống thở chưa?","note":""},{"en":"never","ipa":"/ˈnevə/","pos":"adv","vi":"chưa từng; không bao giờ","ex":"I have never seen snow.","exVi":"Tôi chưa từng nhìn thấy tuyết.","note":""},{"en":"yet","ipa":"/jet/","pos":"adv","vi":"chưa, thường đứng cuối câu phủ định hoặc câu hỏi","ex":"I have not finished the report yet.","exVi":"Tôi chưa viết xong bản báo cáo.","note":""},{"en":"just","ipa":"/dʒʌst/","pos":"adv","vi":"vừa mới","ex":"She has just arrived at the campsite.","exVi":"Cô ấy vừa đến khu cắm trại.","note":""},{"en":"since","ipa":"/sɪns/","pos":"prep","vi":"từ một mốc thời gian đến nay","ex":"I have lived here since 2019.","exVi":"Tôi đã sống ở đây từ năm 2019.","note":"since + mốc (2019, Monday, yesterday). for + khoảng (three years)."},{"en":"for","ipa":"/fɔː/","pos":"prep","vi":"trong suốt một khoảng thời gian","ex":"We have studied English for four years.","exVi":"Chúng tôi đã học tiếng Anh được bốn năm.","note":"Trong thì hiện tại hoàn thành, for không có nghĩa chỉ là cho."}]},{"id":"u6","part":6,"ky":1,"weeks":"13–15","unit":6,"titleVi":"Lối sống Việt Nam xưa và nay","titleEn":"Vietnamese Lifestyle: Then and Now","kind":"unit","blurb":"Unit 6, Kỳ 1. Đối chiếu then (xưa) và now (nay). Tuần 16 là Review 2, tuần 17–18 ôn cuối học kỳ 1.","entries":[{"en":"lifestyle","ipa":"/ˈlaɪfstaɪl/","pos":"n","vi":"lối sống","ex":"City lifestyle is different from village lifestyle.","exVi":"Lối sống thành phố khác lối sống làng quê.","note":""},{"en":"extended family","ipa":"/ɪkˈstendɪd ˈfæməli/","pos":"cụm","vi":"gia đình nhiều thế hệ, gồm ông bà, cô chú","ex":"They live in an extended family with their grandparents.","exVi":"Họ sống trong gia đình nhiều thế hệ cùng ông bà.","note":"extended đứng một mình chỉ nghĩa là mở rộng, không tự nó nghĩa là nhiều thế hệ."},{"en":"nuclear family","ipa":"/ˈnjuːkliə ˈfæməli/","pos":"cụm","vi":"gia đình hạt nhân: bố mẹ và con","ex":"A nuclear family is common in many city flats.","exVi":"Gia đình hạt nhân thường gặp trong nhiều căn hộ thành phố.","note":"Sách có thể ghi tắt nuclear với nghĩa này. Đừng học nuclear = hai thế hệ khi từ đứng riêng ngoài cụm gia đình."},{"en":"family-oriented","ipa":"/ˈfæməli ˌɔːrientɪd/","pos":"adj","vi":"coi trọng gia đình, lấy gia đình làm trung tâm","ex":"Vietnamese culture is strongly family-oriented.","exVi":"Văn hóa Việt rất coi trọng gia đình.","note":""},{"en":"household","ipa":"/ˈhaʊshəʊld/","pos":"n","vi":"hộ gia đình; những người sống chung một nhà","ex":"There are five people in our household.","exVi":"Nhà tôi có năm người.","note":""},{"en":"generation gap","ipa":"/ˌdʒenəˈreɪʃn ɡæp/","pos":"cụm","vi":"khoảng cách thế hệ","ex":"A generation gap can cause arguments at home.","exVi":"Khoảng cách thế hệ có thể gây tranh cãi trong nhà.","note":""},{"en":"gap","ipa":"/ɡæp/","pos":"n","vi":"khoảng cách; chỗ trống","ex":"There is a gap between their opinions about housework.","exVi":"Có một khoảng cách giữa ý kiến của họ về việc nhà.","note":""},{"en":"democratic","ipa":"/ˌdeməˈkrætɪk/","pos":"adj","vi":"dân chủ","ex":"They made a democratic decision as a family.","exVi":"Họ đã quyết định một cách dân chủ trong gia đình.","note":""},{"en":"dependent","ipa":"/dɪˈpendənt/","pos":"adj","vi":"phụ thuộc. Cụm: dependent on","ex":"Young children are dependent on their parents.","exVi":"Trẻ nhỏ phụ thuộc vào bố mẹ.","note":""},{"en":"independent","ipa":"/ˌɪndɪˈpendənt/","pos":"adj","vi":"độc lập, tự lập","ex":"Many teenagers want to become more independent.","exVi":"Nhiều thanh thiếu niên muốn tự lập hơn.","note":""},{"en":"privacy","ipa":"/ˈprɪvəsi/","pos":"n","vi":"sự riêng tư","ex":"Everyone in the house needs some privacy.","exVi":"Ai trong nhà cũng cần một chút riêng tư.","note":""},{"en":"private","ipa":"/ˈpraɪvət/","pos":"adj","vi":"riêng tư, cá nhân","ex":"Please do not read her private diary.","exVi":"Xin đừng đ s in the village pagoda.","exVi":"Nhà sư sống ở ngôi chùa của làng.","note":""},{"en":"promise","ipa":"/ˈprɒmɪs/","pos":"v","vi":"hứa. Cũng là danh từ: lời hứa","ex":"She promised to visit her grandparents every Sunday.","exVi":"Cô ấy hứa thăm ông bà mỗi chủ nhật.","note":""},{"en":"tradition","ipa":"/trəˈdɪʃn/","pos":"n","vi":"truyền thống","ex":"Tet is the most important tradition in our family.","exVi":"Tết là truyền thống quan trọng nhất trong gia đình tôi.","note":""},{"en":"custom","ipa":"/ˈkʌstəm/","pos":"n","vi":"phong tục","ex":"It is a custom to visit relatives at Tet.","exVi":"Thăm họ hàng vào dịp Tết là một phong tục.","note":""},{"en":"value","ipa":"/ˈvæljuː/","pos":"n","vi":"giá trị. Động từ value = coi trọng","ex":"Family is a core value in Vietnamese life.","exVi":"Gia đình là một giá trị cốt lõi trong đời sống Việt Nam.","note":""},{"en":"chore","ipa":"/tʃɔː/","pos":"n","vi":"việc vặt trong nhà","ex":"Sharing chores is more common now than in the past.","exVi":"Chia nhau việc nhà nay phổ biến hơn ngày xưa.","note":""},{"en":"ancestor","ipa":"/ˈænsestə/","pos":"n","vi":"tổ tiên","ex":"Many families remember their ancestors at Tet.","exVi":"Nhiều gia đình tưởng nhớ tổ tiên vào dịp Tết.","note":""},{"en":"conflict","ipa":"/ˈkɒnflɪkt/","pos":"n","vi":"xung đột, bất đồng","ex":"A small conflict can grow if nobody talks.","exVi":"Một bất đồng nhỏ có thể lớn lên nếu không ai nói ra.","note":""},{"en":"tolerant","ipa":"/ˈtɒlərənt/","pos":"adj","vi":"khoan dung, chấp nhận sự khác biệt","ex":"Try to be tolerant of ideas that are new to you.","exVi":"Hãy khoan dung với những ý tưởng còn mới với bạn.","note":""},{"en":"cooperation","ipa":"/kəʊˌɒpəˈreɪʃn/","pos":"n","vi":"sự hợp tác","ex":"Family cooperation makes busy days easier.","exVi":"Sự hợp tác trong gia đình làm những ngày bận trở nên dễ hơn.","note":""}]},{"id":"u7","part":7,"ky":2,"weeks":"1–3","unit":7,"titleVi":"Kỳ quan thiên nhiên thế giới","titleEn":"Natural Wonders of the World","kind":"unit","blu n.","exVi":"Phong Nha là một điểm đến phổ biến.","note":""},{"en":"annual","ipa":"/ˈænjuəl/","pos":"adj","vi":"hằng năm","ex":"The park closes for an annual clean-up.","exVi":"Công viên đóng cửa để dọn vệ sinh hằng năm.","note":""},{"en":"occur","ipa":"/əˈkɜː/","pos":"v","vi":"xảy ra","ex":"Storms often occur in the rainy season.","exVi":"Bão thường xảy ra vào mùa mưa.","note":""},{"en":"permit","ipa":"/pəˈmɪt/","pos":"v","vi":"cho phép","ex":"The rules do not permit camping in this area.","exVi":"Nội quy không cho phép cắm trại ở khu này.","note":"Động từ permit nhấn âm sau. Danh từ giấy phép là permit /ˈpɜːmɪt/. Sự cho phép là permission."},{"en":"permission","ipa":"/pəˈmɪʃn/","pos":"n","vi":"sự cho phép","ex":"You need permission before you enter the cave.","exVi":"Bạn cần sự cho phép trước khi vào hang.","note":""},{"en":"possess","ipa":"/pəˈzes/","pos":"v","vi":"có, sở hữu","ex":"The region possesses several natural wonders.","exVi":"Vùng này có vài kỳ quan thiên nhiên.","note":""},{"en":"admire","ipa":"/ədˈmaɪə/","pos":"v","vi":"ngưỡng mộ","ex":"We stopped to admire the view.","exVi":"Chúng tôi dừng lại để ngắm nhìn quang cảnh.","note":""},{"en":"consider","ipa":"/kənˈsɪdə/","pos":"v","vi":"xem xét; coi là","ex":"Many people consider this bay a natural wonder.","exVi":"Nhiều người coi vịnh này là một kỳ quan thiên nhiên.","note":""},{"en":"hesitate","ipa":"/ˈhezɪteɪt/","pos":"v","vi":"do dự","ex":"Do not hesitate to ask the guide for help.","exVi":"Đừng do dự khi cần hỏi hướng dẫn viên.","note":""},{"en":"urgent","ipa":"/ˈɜːdʒənt/","pos":"adj","vi":"khẩn cấp","ex":"Protecting the reef is an urgent task.","exVi":"Bảo vệ rạn san hô là việc khẩn cấp.","note":""},{"en":"sustainable","ipa":"/səˈsteɪnəbl/","pos":"adj","vi":"bền vững","ex":"We need sustainable tourism around natural wonders.","exVi":"Chúng ta cần du lịch bền vững quanh các kỳ quan.","note":""},{"en":"crazy about","ipa":"/ˈkreɪzi əˈbaʊt/","pos":"adj","vi":"thích mê","ex":"She is crazy about waterfalls.","exVi":"Cô ấy thích thác nước đến mê.","note":"crazy about không dịch là điên. crazy đứng riêng mới có thể nghĩa là điên."},{"en":"geological","ipa":"/ˌdʒiːəˈlɒdʒɪkl/","pos":"adj","vi":"thuộc địa chất","ex":"The canyon is a famous geological feature.","exVi":"Hẻm núi là một đặc điểm địa chất nổi tiếng.","note":""},{"en":"recommend","ipa":"/ˌrekəˈmend/","pos":"v","vi":"giới thiệu, khuyên nên","ex":"I recommend visiting the cave in the dry season.","exVi":"Tôi khuyên nên thăm hang vào mùa khô.","note":""},{"en":"diversity","ipa":"/daɪˈvɜːsəti/","pos":"n","vi":"sự đa dạng","ex":"The forest has a great diversity of birds.","exVi":"Khu rừng có sự đa dạng lớn về chim.","note":""}]},{"id":"u8","part":8,"ky":2,"weeks":"3–5","unit":8,"titleVi":"Du lịch","titleEn":"Tourism","kind":"unit","blurb":"Unit 8, Kỳ 2. Từ để nói về hãng lữ hành, chỗ ở, loại hình du lịch và tác động của khách đến địa phương.","entries":[{"en":"tourism","ipa":"/ˈtʊərɪzəm/","pos":"n","vi":"ngành du lịch; hoạt động du lịch","ex":"Tourism creates jobs for local people.","exVi":"Du lịch tạo việc làm cho người địa phương.","note":""},{"en":"tourist","ipa":"/ˈtʊərɪst/","pos":"n","vi":"khách du lịch","ex":"Too many tourists can harm a small island.","exVi":"Quá nhiều khách có thể làm hại một hòn đảo nhỏ.","note":""},{"en":"agency","ipa":"/ˈeɪdʒənsi/","pos":"n","vi":"hãng, công ty (du lịch)","ex":"We booked the tour through a local agency.","exVi":"Chúng tôi đặt tour qua một hãng địa phương.","note":""},{"en":"agent","ipa":"/ˈeɪdʒənt/","pos":"n","vi":"nhân viên của hãng","ex":"The travel agent explained the itinerary.","exVi":"Nhân viên hãng đã giải thích lịch trình.","note":""},{"en":"brochure","ipa":"/ˈbrəʊʃə/","pos":"n","vi":"tờ giới thiệu, sách quảng cáo","ex":"The brochure shows photos of the beaches.","exVi":"Tờ giới thiệu có ảnh các bãi biển.","note":""},{"en":"domestic","ipa":"/dəˈmestɪk/","pos":"adj","vi":"trong nước","ex":"Domestic tourism grew quickly last summer.","exVi":"Du lịch trong nước tăng nhanh mùa hè năm ngoái.","note":""},{"en":"domestic tourism","ipa":"/dəˈmestɪk ˈtʊərɪzəm/","pos":"cụm","vi":"du lịch trong nước","ex":"Domestic tourism helps small towns.","exVi":"Du lịch trong nước giúp các thị trấn nhỏ.","note":""},{"en":"food tourism","ipa":"/fuːd ˈtʊərɪzəm/","pos":"cụm","vi":"du lịch ẩm thực","ex":"Hoi An is well known for food tourism.","exVi":"Hội An nổi tiếng với du lịch ẩm thực.","note":""},{"en":"sports tourism","ipa":"/spɔːts ˈtʊərɪzəm/","pos":"cụm","vi":"du lịch thể thao","ex":"A marathon can support sports tourism.","exVi":"Một giải chạy marathon có thể thúc đẩy du lịch thể thao.","note":""},{"en":"estimate","ipa":"/ˈestɪmeɪt/","pos":"v","vi":"ước tính","ex":"Experts estimate two million visitors a year.","exVi":"Các chuyên gia ước tính hai triệu lượt khách một năm.","note":"Danh từ số ước tính cũng là estimate, đọc /ˈestɪmət/."},{"en":"fixed","ipa":"/fɪkst/","pos":"adj","vi":"cố định, không đổi","ex":"The price of the tour is fixed.","exVi":"Giá tour là cố định.","note":""},{"en":"holidaymaker","ipa":"/ˈhɒlədeɪmeɪkə/","pos":"n","vi":"người đi nghỉ","ex":"Holidaymakers fill the beach in July.","exVi":"Người đi nghỉ đông nghịt bãi biển vào tháng Bảy.","note":""},{"en":"homestay","ipa":"/ˈhəʊmsteɪ/","pos":"n","vi":"nhà dân đón khách ở","ex":"We stayed in a homestay near the rice fields.","exVi":"Chúng tôi ở một nhà dân gần cánh đồng.","note":""},{"en":"package tour","ipa":"/ˈpækɪdʒ tʊə/","pos":"cụm","vi":"tour trọn gói","ex":"A package tour includes the hotel and the bus.","exVi":"Tour trọn gói gồm khách sạn và xe.","note":""},{"en":"itinerary","ipa":"/aɪˈtɪnərəri/","pos":"n","vi":"lịch trình","ex":"The itinerary includes a cave and a night market.","exVi":"Lịch trình gồm một hang động và một chợ đêm.","note":""},{"en":"accommodation","ipa":"/əˌkɒməˈdeɪʃn/","pos":"n","vi":"chỗ ở","ex":"The price includes accommodation for two nights.","exVi":"Giá gồm chỗ ở hai đêm.","note":"Không đếm được trong cách dùng này: không nói accommodations khi chỉ một loại chỗ ở."},{"en":"resort","ipa":"/rɪˈzɔːt/","pos":"n","vi":"khu nghỉ dưỡng","ex":"The resort is quiet outside the holiday season.","exVi":"Khu nghỉ dưỡng yên tĩnh ngoài mùa nghỉ.","note":""},{"en":"tour guide","ipa":"/ˈtʊə ɡaɪd/","pos":"cụm","vi":"hướng dẫn viên du lịch","ex":"The tour guide spoke both English and Vietnamese.","exVi":"Hướng dẫn viên nói cả tiếng Anh và tiếng Việt.","note":""},{"en":"sightseeing","ipa":"/ˈsaɪtsiːɪŋ/","pos":"n","vi":"việc đi tham quan","ex":"We spent the morning sightseeing in the old town.","exVi":"Chúng tôi dành buổi sáng đi tham quan phố cổ.","note":""},{"en":"check in","ipa":"/tʃek ɪn/","pos":"phr.v","vi":"làm thủ tục nhận phòng hoặc lên máy bay","ex":"Please check in at the hotel before six.","exVi":"Xin làm thủ tục nhận phòng trước sáu giờ.","note":""},{"en":"check out","ipa":"/tʃek aʊt/","pos":"phr.v","vi":"trả phòng","ex":"We must check out before noon.","exVi":"Chúng tôi phải trả phòng trước buổi trưa.","note":""},{"en":"book","ipa":"/bʊk/","pos":"v","vi":"đặt trước (vé, phòng)","ex":"Book the tickets early in peak season.","exVi":"Hãy đặt vé sớm trong mùa cao điểm.","note":""},{"en":"reservation","ipa":"/ˌrezəˈveɪʃn/","pos":"n","vi":"sự đặt chỗ","ex":"I have a reservation for two nights.","exVi":"Tôi đã đặt chỗ cho hai đêm.","note":""},{"en":"peak season","ipa":"/piːk ˈsiːzn/","pos":"cụm","vi":"mùa cao điểm","ex":"Hotels are full in the peak season.","exVi":"Khách sạn kín phòng vào mùa cao điểm.","note":""},{"en":"off-season","ipa":"/ˌɒf ˈsiːzn/","pos":"n","vi":"mùa vắng khách","ex":"Prices are lower in the off-season.","exVi":"Giá thấp hơn vào mùa vắng.","note":""},{"en":"impact","ipa":"/ˈɪmpækt/","pos":"n","vi":"tác động, ảnh hưởng. Cụm: impact on","ex":"Mass tourism has a strong impact on local life.","exVi":"Du lịch ồ ạt tác động mạnh đến đời sống địa phương.","note":""},{"en":"sustainable tourism","ipa":"/səˈsteɪnəbl ˈtʊərɪzəm/","pos":"cụm","vi":"du lịch bền vững","ex":"Sustainable tourism protects both nature and culture.","exVi":"Du lịch bền vững bảo vệ cả thiên nhiên và văn hóa.","note":""},{"en":"souvenir","ipa":"/ˌsuːvəˈnɪə/","pos":"n","vi":"quà lưu niệm","ex":"Buy souvenirs from local artisans if you can.","exVi":"Hãy mua quà lưu niệm từ nghệ nhân địa phương nếu có thể.","note":""},{"en":"graveyard","ipa":"/ˈɡreɪvjɑːd/","pos":"n","vi":"nghĩa trang","ex":"The old graveyard is part of the heritage walk.","exVi":"Nghĩa trang cũ nằm trong tuyến tham quan di sản.","note":"Nghĩa là nghĩa trang, không phải sân chơi."},{"en":"hospitality","ipa":"/ˌhɒspɪˈtæləti/","pos":"n","vi":"lòng hiếu khách","ex":"Visitors remember the hospitality of the hosts.","exVi":"Du khách nhớ lòng hiếu khách của chủ nhà.","note":""},{"en":"currency","ipa":"/ˈkʌrənsi/","pos":"n","vi":"tiền tệ","ex":"Check the local currency before you travel.","exVi":"Hãy xem tiền tệ địa phương trước khi đi.","note":""},{"en":"visa","ipa":"/ˈviːzə/","pos":"n","vi":"thị thực, visa","ex":"Some visitors need a visa before they arrive.","exVi":"Một số du khách cần visa trước khi đến.","note":""},{"en":"luggage","ipa":"/ˈlʌɡɪdʒ/","pos":"n","vi":"hành lý","ex":"Please do not leave your luggage on the bus.","exVi":"Xin đừng để hành lý trên xe.","note":"luggage không đếm được. Không nói luggages. Muốn đếm thì nói a piece of luggage."},{"en":"departure","ipa":"/dɪˈpɑːtʃə/","pos":"n","vi":"sự khởi hành","ex":"The departure time is six in the morning.","exVi":"Giờ khởi hành là sáu giờ sáng.","note":""},{"en":"arrival","ipa":"/əˈraɪvl/","pos":"n","vi":"sự đến nơi","ex":"Our arrival was later than planned.","exVi":"Chúng tôi đến muộn hơn dự định.","note":""}]},{"id":"u9","part":9,"ky":2,"weeks":"5–7","unit":9,"titleVi":"Tiếng Anh trên thế giới","titleEn":"World Englishes","kind":"unit","blurb":"Unit 9, Kỳ 2. Ba vòng đồng tâm của tiếng Anh: Inner Circle, Outer Circle, Expanding Circle. Tuần 8 Kỳ 2 là Review 3.","entries":[{"en":"bilingual","ipa":"/baɪˈlɪŋɡwəl/","pos":"adj","vi":"sử dụng được hai ngôn ngữ","ex":"She is bilingual in Vietnamese and English.","exVi":"Cô ấy dùng được cả tiếng Việt và tiếng Anh.","note":""},{"en":"monolingual","ipa":"/ˌmɒnəˈlɪŋɡwəl/","pos":"adj","vi":"chỉ dùng một ngôn ngữ","ex":"A monolingual dictionary uses only English.","exVi":"Từ điển một ngữ chỉ dùng tiếng Anh.","note":""},{"en":"multilingual","ipa":"/ˌmʌltiˈlɪŋɡwəl/","pos":"adj","vi":"dùng nhiều ngôn ngữ","ex":"The website is multilingual.","exVi":"Trang web có nhiều ngôn ngữ.","note":""},{"en":"first language","ipa":"/ˌfɜːst ˈlæŋɡwɪdʒ/","pos":"cụm","vi":"tiếng mẹ đẻ, ngôn ngữ thứ nhất","ex":"Vietnamese is my first language.","exVi":"Tiếng Việt là tiếng mẹ đẻ của tôi.","note":""},{"en":"native speaker","ipa":"/ˌneɪtɪv ˈspiːkə/","pos":"cụm","vi":"người bản ngữ","ex":"You do not need to sound like a native speaker.","exVi":"Bạn không cần nói nghe như người bản ngữ.","note":""},{"en":"official language","ipa":"/əˌfɪʃl ˈlæŋɡwɪdʒ/","pos":"cụm","vi":"ngôn ngữ chính thức","ex":"English is an official language in Singapore.","exVi":"Tiếng Anh là một ngôn ngữ chính thức ở Singapore.","note":""},{"en":"second language","ipa":"/ˌsekənd ˈlæŋɡwɪdʒ/","pos":"cụm","vi":"ngôn ngữ thứ hai, dùng rộng ở trong nước","ex":"English is a second language in several countries.","exVi":"Tiếng Anh là ngôn ngữ thứ hai ở một số nước.","note":""},{"en":"foreign language","ipa":"/ˌfɒrən ˈlæŋɡwɪdʒ/","pos":"cụm","vi":"ngoại ngữ","ex":"In Vietnam, English is a foreign language.","exVi":"Ở Việt Nam, tiếng Anh là một ngoại ngữ.","note":""},{"en":"borrowed word","ipa":"/ˈbɒrəʊd wɜːd/","pos":"cụm","vi":"từ mượn","ex":"Taxi is a borrowed word in many languages.","exVi":"Taxi là một từ mượn trong nhiều ngôn ngữ.","note":""},{"en":"fluent","ipa":"/ˈfluːənt/","pos":"adj","vi":"trôi chảy, thành thạo","ex":"She is fluent in English after years of practice.","exVi":"Cô ấy nói tiếng Anh trôi chảy sau nhiều năm luyện.","note":""},{"en":"fluency","ipa":"/ˈfluːənsi/","pos":"n","vi":"độ trôi chảy","ex":"Reading aloud can improve fluency.","exVi":"Đọc thành tiếng có thể giúp nói trôi chảy hơn.","note":""},{"en":"accent","ipa":"/ˈæksent/","pos":"n","vi":"giọng (địa phương, quốc gia)","ex":"He has a clear accent, and people understand him.","exVi":"Anh ấy có giọng rõ, và mọi người hiểu anh ấy.","note":"Trong bài này accent là giọng, không chỉ là dấu nhấn."},{"en":"dialect","ipa":"/ˈdaɪəlekt/","pos":"n","vi":"phương ngữ","ex":"A dialect is a form of a language used in one region.","exVi":"Phương ngữ là một dạng của ngôn ngữ dùng ở một vùng.","note":""},{"en":"pronunciation","ipa":"/prəˌnʌnsiˈeɪʃn/","pos":"n","vi":"cách phát âm","ex":"Check the pronunciation in a dictionary.","exVi":"Hãy xem cách phát âm trong từ điển.","note":""},{"en":"spelling","ipa":"/ˈspelɪŋ/","pos":"n","vi":"chính tả","ex":"British spelling and American spelling are sometimes different.","exVi":"Chính tả Anh và chính tả Mỹ đôi khi khác nhau.","note":""},{"en":"vocabulary","ipa":"/vəˈkæbjələri/","pos":"n","vi":"vốn từ","ex":"Reading is a good way to grow your vocabulary.","exVi":"Đọc là cách tốt để tăng vốn từ.","note":""},{"en":"variety","ipa":"/vəˈraɪəti/","pos":"n","vi":"biến thể (của một ngôn ngữ); sự đa dạng","ex":"There are many varieties of English in the world.","exVi":"Có nhiều biến thể tiếng Anh trên thế giới.","note":""},{"en":"lingua franca","ipa":"/ˌlɪŋɡwə ˈfræŋkə/","pos":"cụm","vi":"ngôn ngữ chung để người khác tiếng mẹ đẻ nói với nhau","ex":"English is a lingua franca in international meetings.","exVi":"Tiếng Anh là ngôn ngữ chung trong các cuộc họp quốc tế.","note":""},{"en":"Inner Circle","ipa":"/ˈɪnə ˈsɜːkl/","pos":"cụm","vi":"Vòng trong: các nước dùng tiếng Anh như tiếng mẹ đẻ, ví dụ Anh, Mỹ, Úc","ex":"Britain and Australia are in the Inner Circle.","exVi":"Anh và Úc nằm ở Vòng trong.","note":""},{"en":"Outer Circle","ipa":"/ˈaʊtə ˈsɜːkl/","pos":"cụm","vi":"Vòng ngoài: tiếng Anh là ngôn ngữ chính thức thứ hai, ví dụ Ấn Độ, Singapore","ex":"India is often placed in the Outer Circle.","exVi":"Ấn Độ thường được xếp vào Vòng ngoài.","note":""},{"en":"Expanding Circle","ipa":"/ɪkˈspændɪŋ ˈsɜːkl/","pos":"cụm","vi":"Vòng mở rộng: tiếng Anh là ngoại ngữ, ví dụ Việt Nam","ex":"Vietnam belongs to the Expanding Circle.","exVi":"Việt Nam thuộc Vòng mở rộng.","note":""},{"en":"concentric","ipa":"/kənˈsentrɪk/","pos":"adj","vi":"đồng tâm","ex":"The model uses three concentric circles.","exVi":"Mô hình dùng ba vòng tròn đồng tâm.","note":""},{"en":"consist of","ipa":"/kənˈsɪst əv/","pos":"phr.v","vi":"gồm, bao gồm","ex":"The United Kingdom consists of four countries.","exVi":"Vương quốc Anh gồm bốn nước.","note":"Đúng: consists of. Không nói is consisted of."},{"en":"establish","ipa":"/ɪˈstæblɪʃ/","pos":"v","vi":"thiết lập, thành lập","ex":"They established a club for students who love English.","exVi":"Họ thành lập một câu lạc bộ cho học sinh yêu tiếng Anh.","note":""},{"en":"exchange student","ipa":"/ɪksˈtʃeɪndʒ ˈstjuːdnt/","pos":"cụm","vi":"học sinh trao đổi","ex":"The exchange student is staying with a host family.","exVi":"Học sinh trao đổi đang ở với một gia đình chủ nhà.","note":""},{"en":"widespread","ipa":"/ˈwaɪdspred/","pos":"adj","vi":"phổ biến rộng khắp","ex":"English has become widespread in science.","exVi":"Tiếng Anh đã trở nên phổ biến rộng trong khoa học.","note":""},{"en":"official","ipa":"/əˈfɪʃl/","pos":"adj","vi":"chính thức","ex":"English is an official language there.","exVi":"Tiếng Anh là ngôn ngữ chính thức ở đó.","note":""},{"en":"communication","ipa":"/kəˌmjuːnɪˈkeɪʃn/","pos":"n","vi":"sự giao tiếp","ex":"A shared language makes communication easier.","exVi":"Một ngôn ngữ chung làm việc giao tiếp dễ hơn.","note":""},{"en":"misunderstanding","ipa":"/ˌmɪsʌndəˈstændɪŋ/","pos":"n","vi":"sự hiểu lầm","ex":"A different accent can cause a misunderstanding.","exVi":"Một giọng khác có thể gây hiểu lầm.","note":""},{"en":"translate","ipa":"/trænzˈleɪt/","pos":"v","vi":"dịch","ex":"Please translate this sentence into Vietnamese.","exVi":"Hãy dịch câu này sang tiếng Việt.","note":""},{"en":"translation","ipa":"/trænzˈleɪʃn/","pos":"n","vi":"bản dịch; việc dịch","ex":"A word-for-word translation is not always correct.","exVi":"Dịch từng chữ không phải lúc nào cũng đúng.","note":""},{"en":"context","ipa":"/ˈkɒntekst/","pos":"n","vi":"ngữ cảnh","ex":"Guess the meaning from the context.","exVi":"Hãy đoán nghĩa từ ngữ cảnh.","note":""}]},{"id":"u10","part":10,"ky":2,"weeks":"9–11","unit":10,"titleVi":"Hành tinh Trái Đất","titleEn":"Planet Earth","kind":"unit","blurb":"Unit 10, Kỳ 2, sau tuần 8 ôn giữa kỳ. Từ về khí hậu, ô nhiễm và việc bảo vệ Trái Đất.","entries":[{"en":"planet","ipa":"/ˈplænɪt/","pos":"n","vi":"hành tinh","ex":"Earth is the planet we all share.","exVi":"Trái Đất là hành tinh tất cả chúng ta cùng sống.","note":""},{"en":"environment","ipa":"/ɪnˈvaɪrənmənt/","pos":"n","vi":"môi trường","ex":"We must protect the environment.","exVi":"Chúng ta phải bảo vệ môi trường.","note":""},{"en":"environmental","ipa":"/ɪnˌvaɪrənˈmentl/","pos":"adj","vi":"thuộc môi trường","ex":"Air pollution is an environmental problem.","exVi":"Ô nhiễm không khí là một vấn đề môi trường.","note":""},{"en":"climate","ipa":"/ˈklaɪmət/","pos":"n","vi":"khí hậu, kiểu thời tiết trong nhiều năm","ex":"The climate here is hot and humid.","exVi":"Khí hậu ở đây nóng và ẩm.","note":"climate là khí hậu lâu dài. weather là thời tiết từng ngày."},{"en":"weather","ipa":"/ˈweðə/","pos":"n","vi":"thời tiết","ex":"The weather is rainy today.","exVi":"Hôm nay trời mưa.","note":""},{"en":"climate change","ipa":"/ˈklaɪmət tʃeɪndʒ/","pos":"cụm","vi":"biến đổi khí hậu","ex":"Climate change makes storms more dangerous.","exVi":"Biến đổi khí hậu làm bão nguy hiểm hơn.","note":""},{"en":"global warming","ipa":"/ˌɡləʊbl ˈwɔːmɪŋ/","pos":"cụm","vi":"sự nóng lên toàn cầu","ex":"Global warming is melting ice at the poles.","exVi":"Nóng lên toàn cầu đang làm tan băng ở hai cực.","note":""},{"en":"greenhouse effect","ipa":"/ˈɡriːnhaʊs ɪˌfekt/","pos":"cụm","vi":"hiệu ứng nhà kính","ex":"The greenhouse effect keeps the Earth warm, but too much of it is harmful.","exVi":"Hiệu ứng nhà kính giữ Trái Đất ấm, nhưng quá mức thì có hại.","note":""},{"en":"greenhouse gas","ipa":"/ˈɡriːnhaʊs ɡæs/","pos":"cụm","vi":"khí nhà kính","ex":"Carbon dioxide is a greenhouse gas.","exVi":"Khí cacbon đioxit là một khí nhà kính.","note":""},{"en":"carbon dioxide","ipa":"/ˌkɑːbən daɪˈɒksaɪd/","pos":"n","vi":"khí cacbon đioxit, CO2","ex":"Cars produce carbon dioxide.","exVi":"Ô tô thải ra khí cacbon đioxit.","note":""},{"en":"carbon footprint","ipa":"/ˌkɑːbən ˈfʊtprɪnt/","pos":"cụm","vi":"lượng khí thải một người hoặc một hoạt động gây ra","ex":"Taking the bus reduces your carbon footprint.","exVi":"Đi xe buýt làm giảm lượng khí thải bạn gây ra.","note":""},{"en":"fossil fuel","ipa":"/ˈfɒsl ˈfjuːəl/","pos":"cụm","vi":"nhiên liệu hóa thạch (than, dầu, khí đốt)","ex":"Burning fossil fuels pollutes the air.","exVi":"Đốt nhiên liệu hóa thạch làm ô nhiễm không khí.","note":""},{"en":"renewable","ipa":"/rɪˈnjuːəbl/","pos":"adj","vi":"có thể tái tạo","ex":"Solar power is a renewable source of energy.","exVi":"Năng lượng mặt trời là nguồn năng lượng tái tạo.","note":""},{"en":"non-renewable","ipa":"/ˌnɒn rɪˈnjuːəbl/","pos":"adj","vi":"không tái tạo","ex":"Coal is a non-renewable fuel.","exVi":"Than là nhiên liệu không tái tạo.","note":""},{"en":"pollution","ipa":"/pəˈluːʃn/","pos":"n","vi":"sự ô nhiễm","ex":"Water pollution kills fish in the river.","exVi":"Ô nhiễm nước giết cá dưới sông.","note":""},{"en":"pollute","ipa":"/pəˈluːt/","pos":"v","vi":"làm ô nhiễm","ex":"Factories must not pollute the river.","exVi":"Nhà máy không được làm ô nhiễm sông.","note":""},{"en":"deforestation","ipa":"/diːˌfɒrɪˈsteɪʃn/","pos":"n","vi":"nạn phá rừng","ex":"Deforestation destroys animal habitats.","exVi":"Phá rừng hủy môi trường sống của động vật.","note":""},{"en":"recycle","ipa":"/ˌriːˈsaɪkl/","pos":"v","vi":"tái chế","ex":"We recycle paper, plastic and glass at school.","exVi":"Chúng tôi tái chế giấy, nhựa và thủy tinh ở trường.","note":""},{"en":"reuse","ipa":"/ˌriːˈjuːz/","pos":"v","vi":"dùng lại","ex":"Reuse a bottle instead of buying a new one.","exVi":"Hãy dùng lại chai thay vì mua chai mới.","note":""},{"en":"reduce","ipa":"/rɪˈdjuːs/","pos":"v","vi":"giảm","ex":"Reduce the amount of plastic you throw away.","exVi":"Hãy giảm lượng nhựa bạn vứt đi.","note":""},{"en":"waste","ipa":"/weɪst/","pos":"n","vi":"rác thải; sự lãng phí","ex":"Do not throw waste into the sea.","exVi":"Đừng thải rác xuống biển.","note":""},{"en":"endangered","ipa":"/ɪnˈdeɪndʒəd/","pos":"adj","vi":"có nguy cơ tuyệt chủng","ex":"Tigers are an endangered species.","exVi":"Hổ là một loài có nguy cơ tuyệt chủng.","note":""},{"en":"species","ipa":"/ˈspiːʃiːz/","pos":"n","vi":"loài. Số ít và số nhiều cùng một dạng","ex":"This species lives only in that forest.","exVi":"Loài này chỉ sống trong khu rừng đó.","note":"Không thêm -es. Một loài: a species. Nhiều loài: many species."},{"en":"habitat","ipa":"/ˈhæbɪtæt/","pos":"n","vi":"môi trường sống của một loài","ex":"The forest is the habitat of many birds.","exVi":"Khu rừng là môi trường sống của nhiều loài chim.","note":""},{"en":"conservation","ipa":"/ˌkɒnsəˈveɪʃn/","pos":"n","vi":"sự bảo tồn","ex":"Conservation projects protect rare animals.","exVi":"Các dự án bảo tồn bảo vệ động vật quý hiếm.","note":""},{"en":"protect","ipa":"/prəˈtekt/","pos":"v","vi":"bảo vệ","ex":"Laws protect endangered animals.","exVi":"Luật pháp bảo vệ động vật có nguy cơ tuyệt chủng.","note":""},{"en":"atmosphere","ipa":"/ˈætməsfɪə/","pos":"n","vi":"bầu khí quyển","ex":"Greenhouse gases stay in the atmosphere.","exVi":"Khí nhà kính ở lại trong bầu khí quyển.","note":""},{"en":"emission","ipa":"/ɪˈmɪʃn/","pos":"n","vi":"sự phát thải; lượng khí thải","ex":"The city wants to cut vehicle emissions.","exVi":"Thành phố muốn cắt lượng khí thải từ xe cộ.","note":""},{"en":"sea level","ipa":"/ˈsiː levl/","pos":"cụm","vi":"mực nước biển","ex":"A rising sea level threatens low islands.","exVi":"Mực nước biển dâng đe dọa các đảo thấp.","note":""},{"en":"drought","ipa":"/draʊt/","pos":"n","vi":"hạn hán","ex":"The drought lasted for three months.","exVi":"Đợt hạn hán kéo dài ba tháng.","note":""},{"en":"flood","ipa":"/flʌd/","pos":"n","vi":"lũ, nạn ngập. Động từ: làm ngập","ex":"The flood destroyed many rice fields.","exVi":"Trận lũ phá nhiều cánh đồng lúa.","note":""},{"en":"earthquake","ipa":"/ˈɜːθkweɪk/","pos":"n","vi":"động đất","ex":"The earthquake damaged several old houses.","exVi":"Trận động đất làm hỏng vài ngôi nhà cũ.","note":""},{"en":"tsunami","ipa":"/tsuːˈnɑːmi/","pos":"n","vi":"sóng thần","ex":"A strong earthquake under the sea can cause a tsunami.","exVi":"Một trận động đất mạnh dưới biển có thể gây sóng thần.","note":""},{"en":"volcano","ipa":"/vɒlˈkeɪnəʊ/","pos":"n","vi":"núi lửa","ex":"The volcano has been quiet for many years.","exVi":"Núi lửa đã yên nhiều năm.","note":""},{"en":"disaster","ipa":"/dɪˈzɑːstə/","pos":"n","vi":"thảm họa","ex":"The storm was a disaster for the coastal villages.","exVi":"Cơn bão là một thảm họa với các làng ven biển.","note":""},{"en":"natural disaster","ipa":"/ˌnætʃrəl dɪˈzɑːstə/","pos":"cụm","vi":"thảm họa thiên nhiên","ex":"Floods and droughts are natural disasters.","exVi":"Lũ và hạn hán là thảm họa thiên nhiên.","note":""},{"en":"landfill","ipa":"/ˈlændfɪl/","pos":"n","vi":"bãi chôn lấp rác","ex":"Less waste should go to the landfill.","exVi":"Nên đưa ít rác hơn tới bãi chôn lấp.","note":""},{"en":"ozone layer","ipa":"/ˈəʊzəʊn ˌleɪə/","pos":"cụm","vi":"tầng ôzôn","ex":"The ozone layer protects us from strong sunlight.","exVi":"Tầng ôzôn bảo vệ chúng ta khỏi nắng gắt.","note":""},{"en":"melt","ipa":"/melt/","pos":"v","vi":"tan chảy","ex":"Ice at the poles is melting.","exVi":"Băng ở hai cực đang tan.","note":""},{"en":"rise","ipa":"/raɪz/","pos":"v","vi":"tăng, dâng. Không có tân ngữ. Quá khứ rose, phân từ risen","ex":"The sea level is rising.","exVi":"Mực nước biển đang dâng.","note":"rise tự tăng. raise là nâng cái gì đó lên."},{"en":"raise","ipa":"/reɪz/","pos":"v","vi":"nâng lên; gây dựng. Có tân ngữ","ex":"We must raise awareness of climate change.","exVi":"Chúng ta phải nâng cao nhận thức về biến đổi khí hậu.","note":""}]},{"id":"u11","part":11,"ky":2,"weeks":"11–13","unit":11,"titleVi":"Thiết bị điện tử","titleEn":"Electronic Devices","kind":"unit","blurb":"Unit 11, Kỳ 2. Lợi ích và tác hại của thiết bị: nghiện màn hình, riêng tư, bắt nạt trên mạng.","entries":[{"en":"electronic device","ipa":"/ɪˌlekˈtrɒnɪk dɪˈvaɪs/","pos":"cụm","vi":"thiết bị điện tử","ex":"Switch off electronic devices during the test.","exVi":"Hãy tắt thiết bị điện tử trong giờ kiểm tra.","note":""},{"en":"electronic","ipa":"/ɪˌlekˈtrɒnɪk/","pos":"adj","vi":"điện tử, có mạch và chip","ex":"A smartphone is an electronic device.","exVi":"Điện thoại thông minh là một thiết bị điện tử.","note":""},{"en":"electrical","ipa":"/ɪˈlektrɪkl/","pos":"adj","vi":"thuộc điện; chạy bằng điện","ex":"An electric fan is an electrical appliance.","exVi":"Quạt là một thiết bị chạy bằng điện.","note":"electrical = chạy bằng điện. electronic = điện tử. Đừng đổi cho nhau."},{"en":"device","ipa":"/dɪˈvaɪs/","pos":"n","vi":"thiết bị","ex":"Do not lend your device to a stranger.","exVi":"Đừng cho người lạ mượn thiết bị của bạn.","note":""},{"en":"gadget","ipa":"/ˈɡædʒɪt/","pos":"n","vi":"đồ điện tử nhỏ, món đồ tiện ích","ex":"He loves new gadgets.","exVi":"Cậu ấy thích các món đồ điện tử mới.","note":""},{"en":"smartphone","ipa":"/ˈsmɑːtfəʊn/","pos":"n","vi":"điện thoại thông minh","ex":"I use a smartphone to look up new words.","exVi":"Tôi dùng điện thoại thông minh để tra từ mới.","note":""},{"en":"tablet","ipa":"/ˈtæblət/","pos":"n","vi":"máy tính bảng","ex":"She reads articles on a tablet.","exVi":"Cô ấy đọc bài trên máy tính bảng.","note":""},{"en":"laptop","ipa":"/ˈlæptɒp/","pos":"n","vi":"máy tính xách tay","ex":"My laptop is in my school bag.","exVi":"Máy tính xách tay của tôi ở trong cặp.","note":""},{"en":"screen","ipa":"/skriːn/","pos":"n","vi":"màn hình","ex":"A dirty screen is hard to read.","exVi":"Màn hình bẩn thì khó đọc.","note":""},{"en":"battery","ipa":"/ˈbætri/","pos":"n","vi":"pin. Số nhiều batteries","ex":"The battery is almost empty.","exVi":"Pin gần hết.","note":""},{"en":"charge","ipa":"/tʃɑːdʒ/","pos":"v","vi":"sạc","ex":"I need to charge my phone before the trip.","exVi":"Tôi cần sạc điện thoại trước chuyến đi.","note":""},{"en":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","vi":"ứng dụng; cũng có nghĩa là đơn xin","ex":"This application helps me learn vocabulary.","exVi":"Ứng dụng này giúp tôi học từ vựng.","note":"Trong Unit 11 thường là ứng dụng. Trong Unit 12 là đơn xin việc. Nhìn ngữ cảnh."},{"en":"app","ipa":"/æp/","pos":"n","vi":"ứng dụng (cách nói ngắn của application)","ex":"Delete apps you never open.","exVi":"Hãy xóa những ứng dụng bạn không bao giờ mở.","note":""},{"en":"download","ipa":"/ˌdaʊnˈləʊd/","pos":"v","vi":"tải xuống","ex":"Download the file before the lesson.","exVi":"Hãy tải tệp xuống trước buổi học.","note":""},{"en":"upload","ipa":"/ˌʌpˈləʊd/","pos":"v","vi":"tải lên","ex":"Do not upload a photo of someone without asking.","exVi":"Đừng tải ảnh của người khác lên mà chưa hỏi.","note":""},{"en":"social media","ipa":"/ˌsəʊʃl ˈmiːdiə/","pos":"cụm","vi":"mạng xã hội","ex":"Social media can connect friends, but it can also distract you.","exVi":"Mạng xã hội có thể nối bạn bè, nhưng cũng có thể làm bạn xao nhãng.","note":""},{"en":"password","ipa":"/ˈpɑːswɜːd/","pos":"n","vi":"mật khẩu","ex":"Never share your password.","exVi":"Đừng bao giờ chia sẻ mật khẩu.","note":""},{"en":"account","ipa":"/əˈkaʊnt/","pos":"n","vi":"tài khoản","ex":"Log out of your account on a shared computer.","exVi":"Hãy đăng xuất tài khoản trên máy dùng chung.","note":""},{"en":"online","ipa":"/ˌɒnˈlaɪn/","pos":"adj","vi":"trực tuyến","ex":"We had an online class yesterday.","exVi":"Hôm qua chúng tôi học trực tuyến.","note":""},{"en":"offline","ipa":"/ˌɒfˈlaɪn/","pos":"adj","vi":"ngoại tuyến, không nối mạng","ex":"You can read the saved lesson offline.","exVi":"Bạn có thể đọc bài đã lưu khi không có mạng.","note":""},{"en":"addictive","ipa":"/əˈdɪktɪv/","pos":"adj","vi":"gây nghiện (nói về thứ gây nghiện)","ex":"Some games are highly addictive.","exVi":"Một số trò chơi rất gây nghiện.","note":""},{"en":"addicted","ipa":"/əˈdɪktɪd/","pos":"adj","vi":"bị nghiện. Cụm: addicted to","ex":"He is addicted to short videos.","exVi":"Cậu ấy bị nghiện video ngắn.","note":"Việc thì addictive. Người thì addicted."},{"en":"benefit","ipa":"/ˈbenɪfɪt/","pos":"n","vi":"lợi ích. Động từ: có lợi cho","ex":"One benefit of a laptop is that you can study anywhere.","exVi":"Một lợi ích của máy tính xách tay là bạn học được ở nhiều nơi.","note":""},{"en":"drawback","ipa":"/ˈdrɔːbæk/","pos":"n","vi":"mặt hạn chế, nhược điểm","ex":"A drawback of social media is lack of sleep.","exVi":"Một mặt hạn chế của mạng xã hội là thiếu ngủ.","note":""},{"en":"cyberbullying","ipa":"/ˈsaɪbəbʊliɪŋ/","pos":"n","vi":"bắt nạt trên mạng","ex":"Tell a trusted adult if you face cyberbullying.","exVi":"Hãy nói với người lớn đáng tin nếu bạn bị bắt nạt trên mạng.","note":""},{"en":"privacy","ipa":"/ˈprɪvəsi/","pos":"n","vi":"sự riêng tư","ex":"Check the privacy settings of the app.","exVi":"Hãy kiểm tra phần cài đặt riêng tư của ứng dụng.","note":""},{"en":"portable","ipa":"/ˈpɔːtəbl/","pos":"adj","vi":"dễ mang theo","ex":"A tablet is more portable than a desktop computer.","exVi":"Máy tính bảng dễ mang hơn máy tính để bàn.","note":""},{"en":"wireless","ipa":"/ˈwaɪələs/","pos":"adj","vi":"không dây","ex":"The school has wireless internet.","exVi":"Trường có internet không dây.","note":""},{"en":"software","ipa":"/ˈsɒftweə/","pos":"n","vi":"phần mềm","ex":"Update the software when the school asks you to.","exVi":"Hãy cập nhật phần mềm khi nhà trường yêu cầu.","note":"software không đếm được."},{"en":"hardware","ipa":"/ˈhɑːdweə/","pos":"n","vi":"phần cứng","ex":"The screen and the battery are hardware.","exVi":"Màn hình và pin là phần cứng.","note":""},{"en":"upgrade","ipa":"/ˌʌpˈɡreɪd/","pos":"v","vi":"nâng cấp","ex":"They upgraded the school computers last month.","exVi":"Tháng trước họ đã nâng cấp máy tính của trường.","note":""},{"en":"depend on","ipa":"/dɪˈpend ɒn/","pos":"phr.v","vi":"phụ thuộc vào","ex":"Do not depend on one device for all your revision.","exVi":"Đừng phụ thuộc vào một thiết bị cho toàn bộ việc ôn bài.","note":""},{"en":"turn off","ipa":"/tɜːn ɒf/","pos":"phr.v","vi":"tắt","ex":"Turn off the screen one hour before bed.","exVi":"Hãy tắt màn hình một giờ trước khi ngủ.","note":""},{"en":"turn on","ipa":"/tɜːn ɒn/","pos":"phr.v","vi":"bật","ex":"Turn on the laptop and open your notes.","exVi":"Hãy bật máy và mở ghi chép.","note":""},{"en":"plug in","ipa":"/plʌɡ ɪn/","pos":"phr.v","vi":"cắm điện","ex":"Plug in the charger if the battery is low.","exVi":"Hãy cắm sạc nếu pin yếu.","note":""},{"en":"e-reader","ipa":"/ˈiː riːdə/","pos":"n","vi":"máy đọc sách điện tử","ex":"She reads novels on an e-reader.","exVi":"Cô ấy đọc tiểu thuyết trên máy đọc sách.","note":""},{"en":"headphone","ipa":"/ˈhedfəʊn/","pos":"n","vi":"tai nghe. Thường dùng số nhiều headphones","ex":"Use headphones in the library.","exVi":"Hãy dùng tai nghe trong thư viện.","note":""},{"en":"multifunctional","ipa":"/ˌmʌltiˈfʌŋkʃənl/","pos":"adj","vi":"đa chức năng","ex":"A smartphone is a multifunctional device.","exVi":"Điện thoại thông minh là thiết bị đa chức năng.","note":""},{"en":"screen time","ipa":"/ˈskriːn taɪm/","pos":"cụm","vi":"thời gian nhìn màn hình","ex":"Too much screen time can hurt your sleep.","exVi":"Nhìn màn hình quá nhiều có thể hại giấc ngủ.","note":""}]},{"id":"u12","part":12,"ky":2,"weeks":"13–15","unit":12,"titleVi":"Lựa chọn nghề nghiệp","titleEn":"Career Choices","kind":"unit","blurb":"Unit 12, Kỳ 2. Tính cách, bằng cấp và cách nói về nghề. Tuần 16 là Review 4. Tuần 17 ôn cuối kỳ 2 và thi vào 10.","entries":[{"en":"career","ipa":"/kəˈrɪə/","pos":"n","vi":"sự nghiệp, con đường nghề trong nhiều năm","ex":"She hopes to have a career in medicine.","exVi":"Cô ấy hy vọng có sự nghiệp trong ngành y.","note":"career là cả chặng nghề. job là một việc làm cụ thể."},{"en":"job","ipa":"/dʒɒb/","pos":"n","vi":"việc làm, một công việc cụ thể","ex":"He has a part-time job at a bookshop.","exVi":"Cậu ấy có một việc làm bán thời gian ở hiệu sách.","note":""},{"en":"occupation","ipa":"/ˌɒkjuˈpeɪʃn/","pos":"n","vi":"nghề nghiệp","ex":"Please write your occupation on the form.","exVi":"Hãy ghi nghề của bạn vào mẫu đơn.","note":""},{"en":"profession","ipa":"/prəˈfeʃn/","pos":"n","vi":"nghề cần đào tạo chuyên môn","ex":"Teaching is a respected profession.","exVi":"Dạy học là một nghề được kính trọng.","note":""},{"en":"cashier","ipa":"/kæˈʃɪə/","pos":"n","vi":"thu ngân","ex":"The cashier gave me the receipt.","exVi":"Thu ngân đưa tôi hóa đơn.","note":""},{"en":"bartender","ipa":"/ˈbɑːtendə/","pos":"n","vi":"người pha chế ở quầy đồ uống","ex":"A bartender needs to be polite and quick.","exVi":"Người pha chế cần lịch sự và nhanh.","note":""},{"en":"assembly worker","ipa":"/əˈsembli ˈwɜːkə/","pos":"cụm","vi":"công nhân lắp ráp trên dây chuyền","ex":"An assembly worker fits parts together in a factory.","exVi":"Công nhân lắp ráp ráp các bộ phận trong nhà máy.","note":""},{"en":"engineer","ipa":"/ˌendʒɪˈnɪə/","pos":"n","vi":"kỹ sư","ex":"The engineer designed the new bridge.","exVi":"Kỹ sư đã thiết kế cây cầu mới.","note":""},{"en":"agriculture","ipa":"/ˈæɡrɪkʌltʃə/","pos":"n","vi":"nông nghiệp","ex":"Modern agriculture uses both machines and care for the soil.","exVi":"Nông nghiệp hiện đại dùng cả máy móc và sự chăm đất.","note":""},{"en":"decisive","ipa":"/dɪˈsaɪsɪv/","pos":"adj","vi":"quyết đoán","ex":"A team leader should be decisive.","exVi":"Người đứng đầu nhóm nên quyết đoán.","note":""},{"en":"demanding","ipa":"/dɪˈmɑːndɪŋ/","pos":"adj","vi":"đòi hỏi cao, vất vả","ex":"Being a doctor is a demanding job.","exVi":"Làm bác sĩ là một nghề đòi hỏi cao.","note":""},{"en":"qualification","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","pos":"n","vi":"bằng cấp, trình độ chuyên môn","ex":"This job asks for a qualification in English.","exVi":"Công việc này yêu cầu bằng cấp về tiếng Anh.","note":""},{"en":"qualified","ipa":"/ˈkwɒlɪfaɪd/","pos":"adj","vi":"đủ trình độ, có bằng cấp phù hợp","ex":"She is qualified to teach maths.","exVi":"Cô ấy đủ trình độ để dạy toán.","note":""},{"en":"apply for","ipa":"/əˈplaɪ fɔː/","pos":"phr.v","vi":"nộp đơn xin","ex":"He will apply for a summer job.","exVi":"Cậu ấy sẽ nộp đơn xin một việc làm mùa hè.","note":"Đúng: apply for a job. Không nói apply a job."},{"en":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","vi":"ứng dụng; cũng có nghĩa là đơn xin","ex":"Send your application before the deadline.","exVi":"Hãy gửi đơn trước hạn cuối.","note":""},{"en":"interview","ipa":"/ˈɪntəvjuː/","pos":"n","vi":"buổi phỏng vấn. Cũng là động từ: phỏng vấn","ex":"She has a job interview on Friday.","exVi":"Cô ấy có buổi phỏng vấn xin việc vào thứ Sáu.","note":""},{"en":"CV","ipa":"/ˌsiː ˈviː/","pos":"n","vi":"sơ yếu lý lịch. Viết tắt của curriculum vitae","ex":"A clear CV helps the employer.","exVi":"Một sơ yếu lý lịch rõ ràng giúp người tuyển dụng.","note":""},{"en":"salary","ipa":"/ˈsæləri/","pos":"n","vi":"lương, thường tính theo tháng và khá cố định","ex":"The salary is paid at the end of the month.","exVi":"Lương được trả vào cuối tháng.","note":""},{"en":"wage","ipa":"/weɪdʒ/","pos":"n","vi":"tiền công, thường tính theo giờ hoặc tuần","ex":"His wage depends on the hours he works.","exVi":"Tiền công của anh ấy tùy số giờ anh ấy làm.","note":""},{"en":"employer","ipa":"/ɪmˈplɔɪə/","pos":"n","vi":"người sử dụng lao động, chủ","ex":"The employer explained the working hours.","exVi":"Người chủ đã giải thích giờ làm.","note":""},{"en":"employee","ipa":"/ɪmˈplɔɪiː/","pos":"n","vi":"người làm công, nhân viên","ex":"Every employee wears a name card.","exVi":"Mọi nhân viên đều đeo thẻ tên.","note":"employer là chủ. employee là người được thuê. Đuôi -ee chỉ người nhận hành động."},{"en":"colleague","ipa":"/ˈkɒliːɡ/","pos":"n","vi":"đồng nghiệp","ex":"She discussed the plan with a colleague.","exVi":"Cô ấy bàn kế hoạch với một đồng nghiệp.","note":""},{"en":"full-time","ipa":"/ˌfʊl ˈtaɪm/","pos":"adj","vi":"toàn thời gian","ex":"He wants a full-time job after grade 12.","exVi":"Anh ấy muốn một việc toàn thời gian sau lớp 12.","note":""},{"en":"part-time","ipa":"/ˌpɑːt ˈtaɪm/","pos":"adj","vi":"bán thời gian","ex":"She has a part-time job on Saturdays.","exVi":"Cô ấy có việc bán thời gian vào thứ Bảy.","note":""},{"en":"responsibility","ipa":"/rɪˌspɒnsəˈbɪləti/","pos":"n","vi":"trách nhiệm","ex":"Keeping the lab safe is your responsibility.","exVi":"Giữ phòng thí nghiệm an toàn là trách nhiệm của bạn.","note":""},{"en":"responsible","ipa":"/rɪˈspɒnsəbl/","pos":"adj","vi":"có trách nhiệm. Cụm: responsible for","ex":"Who is responsible for locking the door?","exVi":"Ai chịu trách nhiệm khóa cửa?","note":""},{"en":"creative","ipa":"/kriˈeɪtɪv/","pos":"adj","vi":"sáng tạo","ex":"A designer needs to be creative.","exVi":"Nhà thiết kế cần sáng tạo.","note":""},{"en":"patient","ipa":"/ˈpeɪʃnt/","pos":"adj","vi":"kiên nhẫn. Danh từ patient = bệnh nhân","ex":"A good teacher is patient with learners.","exVi":"Một giáo viên tốt thì kiên nhẫn với người học.","note":"Nhìn loại từ: tính từ là kiên nhẫn, danh từ là bệnh nhân."},{"en":"hard-working","ipa":"/ˌhɑːd ˈwɜːkɪŋ/","pos":"adj","vi":"chăm chỉ","ex":"Hard-working students revise a little every day.","exVi":"Học sinh chăm chỉ ôn một ít mỗi ngày.","note":""},{"en":"teamwork","ipa":"/ˈtiːmwɜːk/","pos":"n","vi":"làm việc nhóm","ex":"This project depends on teamwork.","exVi":"Dự án này dựa vào làm việc nhóm.","note":""},{"en":"well-paid","ipa":"/ˌwel ˈpeɪd/","pos":"adj","vi":"được trả lương cao","ex":"It is a well-paid job, but it is stressful.","exVi":"Đó là việc lương cao, nhưng gây căng
