 thẳng.","note":""},{"en":"stressful","ipa":"/ˈstresfl/","pos":"adj","vi":"gây căng thẳng","ex":"Working at night can be stressful.","exVi":"Làm việc ban đêm có thể gây căng thẳng.","note":""},{"en":"suitable","ipa":"/ˈsuːtəbl/","pos":"adj","vi":"phù hợp. Cụm: suitable for","ex":"Is this career suitable for you?","exVi":"Sự nghiệp này có phù hợp với bạn không?","note":""},{"en":"ambition","ipa":"/æmˈbɪʃn/","pos":"n","vi":"hoài bão","ex":"Her ambition is to become an architect.","exVi":"Hoài bão của cô ấy là trở thành kiến trúc sư.","note":""},{"en":"ambitious","ipa":"/æmˈbɪʃəs/","pos":"adj","vi":"có hoài bão","ex":"Ambitious students set clear goals.","exVi":"Học sinh có hoài bão đặt mục tiêu rõ.","note":""},{"en":"goal","ipa":"/ɡəʊl/","pos":"n","vi":"mục tiêu","ex":"My goal this year is to pass the entrance exam.","exVi":"Mục tiêu của tôi năm nay là đậu kỳ thi vào lớp 10.","note":""},{"en":"accountant","ipa":"/əˈkaʊntənt/","pos":"n","vi":"kế toán","ex":"An accountant checks the company's numbers.","exVi":"Kế toán kiểm tra các con số của công ty.","note":""},{"en":"architect","ipa":"/ˈɑːkɪtekt/","pos":"n","vi":"kiến trúc sư","ex":"The architect drew the plan of the school.","exVi":"Kiến trúc sư đã vẽ mặt bằng ngôi trường.","note":""},{"en":"pilot","ipa":"/ˈpaɪlət/","pos":"n","vi":"phi công","ex":"The pilot checked the weather before take-off.","exVi":"Phi công kiểm tra thời tiết trước khi cất cánh.","note":""},{"en":"mechanic","ipa":"/məˈkænɪk/","pos":"n","vi":"thợ máy","ex":"The mechanic repaired the bus engine.","exVi":"Thợ máy đã sửa động cơ xe buýt.","note":""},{"en":"programmer","ipa":"/ˈprəʊɡræmə/","pos":"n","vi":"lập trình viên","ex":"A programmer writes and tests software.","exVi":"Lập trình viên viết và kiểm thử phần mềm.","note":""},{"en":"designer","ipa":"/dɪˈzaɪnə/","pos":"n","vi":"nhà thiết kế","ex":"The designer chose the colours of the book.","exVi":"Nhà thiết kế đã chọn màu của cuốn sách.","note":""},{"en":"chef","ipa":"/ʃef/","pos":"n","vi":"bếp trưởng","ex":"The chef prepared a local speciality.","exVi":"Bếp trưởng đã làm một món đặc sản địa phương.","note":"chef đọc /ʃef/, không đọc chữ ch."},{"en":"shift","ipa":"/ʃɪft/","pos":"n","vi":"ca làm việc","ex":"Nurses often work a night shift.","exVi":"Điều dưỡng thường làm ca đêm.","note":""},{"en":"recruit","ipa":"/rɪˈkruːt/","pos":"v","vi":"tuyển dụng","ex":"The company will recruit two new guides.","exVi":"Công ty sẽ tuyển hai hướng dẫn viên mới.","note":""},{"en":"vacancy","ipa":"/ˈveɪkənsi/","pos":"n","vi":"vị trí còn trống","ex":"There is a vacancy for a part-time cashier.","exVi":"Có một chỗ trống cho thu ngân bán thời gian.","note":""}]},{"id":"phrasal","part":13,"ky":0,"weeks":"","unit":null,"titleVi":"Cụm động từ hay ra đề vào 10","titleEn":"Phrasal verbs for the entrance exam","kind":"exam","blurb":"Ôn thi vào 10, không gắn một tuần SGK. Mỗi cụm một nghĩa đúng trong đề. Một cụm có thể có nghĩa khác; nghĩa dưới đây là nghĩa đề hay hỏi.","entries":[{"en":"look after","ipa":"/lʊk ˈɑːftə/","pos":"phr.v","vi":"chăm sóc","ex":"She looks after her little brother after school.","exVi":"Cô ấy chăm em trai sau giờ học.","note":""},{"en":"look for","ipa":"/lʊk fɔː/","pos":"phr.v","vi":"tìm kiếm","ex":"I am looking for my English notebook.","exVi":"Tôi đang tìm vở tiếng Anh.","note":""},{"en":"look forward to","ipa":"/lʊk ˈfɔːwəd tuː/","pos":"phr.v","vi":"mong đợi","ex":"I look forward to hearing from you.","exVi":"Tôi mong được nhận tin của bạn.","note":"look forward to + V-ing hoặc danh từ. Không nói look forward to hear."},{"en":"look up","ipa":"/lʊk ʌp/","pos":"phr.v","vi":"tra cứu","ex":"Look up the word in a dictionary.","exVi":"Hãy tra từ trong từ điển.","note":""},{"en":"give up","ipa":"/ɡɪv ʌp/","pos":"phr.v","vi":"từ bỏ","ex":"Do not give up when the exercise is hard.","exVi":"Đừng bỏ cuộc khi bài tập khó.","note":"give up + V-ing: give up smoking."},{"en":"put off","ipa":"/pʊt ɒf/","pos":"phr.v","vi":"trì hoãn","ex":"Do not put off your revision.","exVi":"Đừng trì hoãn việc ôn bài.","note":""},{"en":"put on","ipa":"/pʊt ɒn/","pos":"phr.v","vi":"mặc vào; đội, đi (giày)","ex":"Put on a raincoat before you leave.","exVi":"Hãy mặc áo mưa trước khi ra ngoài.","note":""},{"en":"put out","ipa":"/pʊt aʊt/","pos":"phr.v","vi":"dập (lửa)","ex":"The firefighter put out the fire.","exVi":"Lính cứu hỏa đã dập lửa.","note":""},{"en":"take off","ipa":"/teɪk ɒf/","pos":"phr.v","vi":"cất cánh; cởi ra","ex":"The plane takes off at seven.","exVi":"Máy bay cất cánh lúc bảy giờ.","note":""},{"en":"take after","ipa":"/teɪk ˈɑːftə/","pos":"phr.v","vi":"giống (một người trong gia đình)","ex":"He takes after his father.","exVi":"Cậu ấy giống bố.","note":""},{"en":"take part in","ipa":"/teɪk pɑːt ɪn/","pos":"phr.v","vi":"tham gia vào một hoạt động","ex":"She took part in the English contest.","exVi":"Cô ấy đã tham gia cuộc thi tiếng Anh.","note":""},{"en":"get over","ipa":"/ɡet ˈəʊvə/","pos":"phr.v","vi":"vượt qua (bệnh, nỗi buồn)","ex":"It took him a week to get over the cold.","exVi":"Cậu ấy mất một tuần để khỏi cảm.","note":""},{"en":"get up","ipa":"/ɡet ʌp/","pos":"phr.v","vi":"thức dậy","ex":"I get up at five on school days.","exVi":"Tôi dậy lúc năm giờ những ngày đi học.","note":""},{"en":"go on","ipa":"/ɡəʊ ɒn/","pos":"phr.v","vi":"tiếp tục","ex":"Please go on with your story.","exVi":"Xin hãy kể tiếp câu chuyện.","note":""},{"en":"turn up","ipa":"/tɜːn ʌp/","pos":"phr.v","vi":"xuất hiện; vặn to","ex":"He turned up ten minutes late.","exVi":"Anh ấy xuất hiện muộn mười phút.","note":""},{"en":"turn down","ipa":"/tɜːn daʊn/","pos":"phr.v","vi":"từ chối; vặn nhỏ","ex":"She turned down the job offer.","exVi":"Cô ấy đã từ chối lời mời làm việc.","note":""},{"en":"run out of","ipa":"/rʌn aʊt əv/","pos":"phr.v","vi":"hết, cạn","ex":"We have run out of paper.","exVi":"Chúng tôi đã hết giấy.","note":""},{"en":"set off","ipa":"/set ɒf/","pos":"phr.v","vi":"khởi hành","ex":"We set off for Hue at dawn.","exVi":"Chúng tôi khởi hành đi Huế lúc bình minh.","note":""},{"en":"set up","ipa":"/set ʌp/","pos":"phr.v","vi":"thành lập, thiết lập","ex":"They set up an English club.","exVi":"Họ thành lập một câu lạc bộ tiếng Anh.","note":""},{"en":"carry out","ipa":"/ˈkæri aʊt/","pos":"phr.v","vi":"tiến hành, thực hiện","ex":"The class carried out a survey.","exVi":"Lớp đã tiến hành một cuộc khảo sát.","note":""},{"en":"cut down on","ipa":"/kʌt daʊn ɒn/","pos":"phr.v","vi":"cắt giảm","ex":"Cut down on sugary drinks.","exVi":"Hãy cắt giảm đồ uống có đường.","note":""},{"en":"deal with","ipa":"/diːl wɪð/","pos":"phr.v","vi":"xử lý, đối phó","ex":"The guide knew how to deal with the delay.","exVi":"Hướng dẫn viên biết cách xử lý việc chậm trễ.","note":""},{"en":"keep up with","ipa":"/kiːp ʌp wɪð/","pos":"phr.v","vi":"theo kịp","ex":"It is hard to keep up with every new app.","exVi":"Khó mà theo kịp mọi ứng dụng mới.","note":""},{"en":"make up","ipa":"/meɪk ʌp/","pos":"phr.v","vi":"bịa ra; làm lành","ex":"Do not make up an excuse.","exVi":"Đừng bịa lý do.","note":""},{"en":"fill in","ipa":"/fɪl ɪn/","pos":"phr.v","vi":"điền vào","ex":"Fill in the form in capital letters.","exVi":"Hãy điền mẫu bằng chữ in hoa.","note":""},{"en":"grow up","ipa":"/ɡrəʊ ʌp/","pos":"phr.v","vi":"lớn lên","ex":"She grew up in a craft village.","exVi":"Cô ấy lớn lên ở một làng nghề.","note":""},{"en":"bring up","ipa":"/brɪŋ ʌp/","pos":"phr.v","vi":"nuôi dạy","ex":"Her grandparents brought her up.","exVi":"Ông bà đã nuôi dạy cô ấy.","note":""},{"en":"call off","ipa":"/kɔːl ɒf/","pos":"phr.v","vi":"hủy","ex":"They called off the picnic because of the storm.","exVi":"Họ hủy buổi dã ngoại vì bão.","note":""},{"en":"work out","ipa":"/wɜːk aʊt/","pos":"phr.v","vi":"tập thể dục; giải được (bài)","ex":"I could not work out the last question.","exVi":"Tôi không giải được câu cuối.","note":""},{"en":"break down","ipa":"/breɪk daʊn/","pos":"phr.v","vi":"hỏng máy; suy sụp","ex":"The bus broke down on the way.","exVi":"Xe buýt bị hỏng giữa đường.","note":""},{"en":"come across","ipa":"/kʌm əˈkrɒs/","pos":"phr.v","vi":"tình cờ gặp, tình cờ thấy","ex":"I came across this word in a story.","exVi":"Tôi tình cờ gặp từ này trong một truyện.","note":""},{"en":"hand in","ipa":"/hænd ɪn/","pos":"phr.v","vi":"nộp","ex":"Hand in your paper before the bell.","exVi":"Hãy nộp bài trước khi chuông reo.","note":""},{"en":"pick up","ipa":"/pɪk ʌp/","pos":"phr.v","vi":"đón; nhặt lên; học được (một cách tự nhiên)","ex":"She picked up some English from songs.","exVi":"Cô ấy học được một ít tiếng Anh từ bài hát.","note":""},{"en":"drop off","ipa":"/drɒp ɒf/","pos":"phr.v","vi":"thả (ai) xuống","ex":"The bus drops us off at the school gate.","exVi":"Xe buýt thả chúng tôi ở cổng trường.","note":""},{"en":"depend on","ipa":"/dɪˈpend ɒn/","pos":"phr.v","vi":"phụ thuộc vào","ex":"Success depends on daily practice.","exVi":"Thành công phụ thuộc vào việc luyện mỗi ngày.","note":""},{"en":"find out","ipa":"/faɪnd aʊt/","pos":"phr.v","vi":"tìm ra sự thật","ex":"We need to find out why the river is dirty.","exVi":"Chúng ta cần tìm ra vì sao dòng sông bẩn.","note":""}]},{"id":"family","part":14,"ky":0,"weeks":"","unit":null,"titleVi":"Họ từ hay ra đề","titleEn":"Word families","kind":"exam","blurb":"Dạng điền từ đúng loại chiếm nhiều điểm từ vựng khi thi vào 10. Học cả họ, đừng chỉ nhớ một dạng.","entries":[{"en":"success","ipa":"/səkˈses/","pos":"họ từ","vi":"success (n) sự thành công · succeed (v) thành công · successful (adj) thành công · successfully (adv) một cách thành công","ex":"She succeeded because she revised every day.","exVi":"Cô ấy đã thành công vì ôn bài mỗi ngày.","note":"Sau mạo từ hoặc tính từ sở hữu cần danh từ: her success. Sau chủ ngữ cần động từ: she succeeded."},{"en":"decide","ipa":"/dɪˈsaɪd/","pos":"họ từ","vi":"decide (v) quyết định · decision (n) quyết định · decisive (adj) quyết đoán · decisively (adv) một cách quyết đoán","ex":"They made a decision after the meeting.","exVi":"Họ đã đưa ra quyết định sau cuộc họp.","note":"make a decision, không nói do a decision."},{"en":"attract","ipa":"/əˈtrækt/","pos":"họ từ","vi":"attract (v) thu hút · attraction (n) điểm thu hút; sự thu hút · attractive (adj) hấp dẫn · attractively (adv) một cách hấp dẫn","ex":"The old town attracts many visitors.","exVi":"Phố cổ thu hút nhiều du khách.","note":""},{"en":"tradition","ipa":"/trəˈdɪʃn/","pos":"họ từ","vi":"tradition (n) truyền thống · traditional (adj) truyền thống · traditionally (adv) theo truyền thống","ex":"This dish is traditionally served at Tet.","exVi":"Món này theo truyền thống được dọn vào dịp Tết.","note":""},{"en":"create","ipa":"/kriˈeɪt/","pos":"họ từ","vi":"create (v) tạo ra · creation (n) sự sáng tạo; tác phẩm · creative (adj) sáng tạo · creativity (n) tính sáng tạo · creatively (adv) một cách sáng tạo","ex":"The students created a poster about the village.","exVi":"Học sinh đã tạo một áp phích về ngôi làng.","note":""},{"en":"differ","ipa":"/ˈdɪfə/","pos":"họ từ","vi":"differ (v) khác · difference (n) sự khác nhau · different (adj) khác · differently (adv) một cách khác","ex":"City life differs from village life.","exVi":"Đời sống thành phố khác đời sống làng.","note":""},{"en":"depend","ipa":"/dɪˈpend/","pos":"họ từ","vi":"depend (v) phụ thuộc · dependence (n) sự phụ thuộc · dependent (adj) phụ thuộc · independent (adj) độc lập · independence (n) sự độc lập","ex":"Children are dependent on their parents.","exVi":"Trẻ em phụ thuộc vào bố mẹ.","note":""},{"en":"employ","ipa":"/ɪmˈplɔɪ/","pos":"họ từ","vi":"employ (v) thuê, tuyển · employer (n) chủ · employee (n) nhân viên · employment (n) việc làm · unemployed (adj) thất nghiệp","ex":"The hotel employs twenty local people.","exVi":"Khách sạn thuê hai mươi người địa phương.","note":""},{"en":"educate","ipa":"/ˈedʒukeɪt/","pos":"họ từ","vi":"educate (v) giáo dục · education (n) giáo dục, sự học · educational (adj) mang tính giáo dục","ex":"The museum visit was educational.","exVi":"Chuyến thăm bảo tàng mang tính giáo dục.","note":""},{"en":"protect","ipa":"/prəˈtekt/","pos":"họ từ","vi":"protect (v) bảo vệ · protection (n) sự bảo vệ · protective (adj) có tính bảo vệ","ex":"The law gives protection to rare animals.","exVi":"Luật này bảo vệ các loài quý hiếm.","note":""},{"en":"develop","ipa":"/dɪˈveləp/","pos":"họ từ","vi":"develop (v) phát triển · development (n) sự phát triển · developed (adj) đã phát triển · developing (adj) đang phát triển","ex":"Tourism helps the development of the town.","exVi":"Du lịch giúp thị trấn phát triển.","note":""},{"en":"pollute","ipa":"/pəˈluːt/","pos":"họ từ","vi":"pollute (v) làm ô nhiễm · pollution (n) sự ô nhiễm · polluted (adj) bị ô nhiễm","ex":"The river is badly polluted.","exVi":"Dòng sông bị ô nhiễm nặng.","note":""},{"en":"environment","ipa":"/ɪnˈvaɪrənmənt/","pos":"họ từ","vi":"environment (n) môi trường · environmental (adj) thuộc môi trường · environmentally (adv) về mặt môi trường","ex":"We should live in an environmentally friendly way.","exVi":"Chúng ta nên sống theo cách thân thiện với môi trường.","note":""},{"en":"nature","ipa":"/ˈneɪtʃə/","pos":"họ từ","vi":"nature (n) thiên nhiên · natural (adj) tự nhiên · naturally (adv) một cách tự nhiên","ex":"Ha Long Bay is a natural wonder.","exVi":"Vịnh Hạ Long là một kỳ quan thiên nhiên.","note":""},{"en":"tour","ipa":"/tʊə/","pos":"họ từ","vi":"tour (n, v) chuyến du lịch; đi du lịch · tourism (n) ngành du lịch · tourist (n) khách du lịch","ex":"Tourists should respect local customs.","exVi":"Khách du lịch nên tôn trọng phong tục địa phương.","note":""},{"en":"communicate","ipa":"/kəˈmjuːnɪkeɪt/","pos":"họ từ","vi":"communicate (v) giao tiếp · communication (n) sự giao tiếp · communicative (adj) hay giao tiếp, cởi mở","ex":"Good communication prevents misunderstandings.","exVi":"Giao tiếp tốt ngăn được hiểu lầm.","note":""},{"en":"inform","ipa":"/ɪnˈfɔːm/","pos":"họ từ","vi":"inform (v) thông báo · information (n) thông tin · informative (adj) nhiều thông tin hữu ích","ex":"The brochure is informative.","exVi":"Tờ giới thiệu có nhiều thông tin hữu ích.","note":"information không đếm được: không nói informations hay an information."},{"en":"excite","ipa":"/ɪkˈsaɪt/","pos":"họ từ","vi":"excite (v) làm hào hứng · excitement (n) sự hào hứng · excited (adj) đang hào hứng · exciting (adj) gây hào hứng","ex":"The match was exciting, so the crowd was excited.","exVi":"Trận đấu gây hào hứng, nên khán giả rất hào hứng.","note":""},{"en":"disappoint","ipa":"/ˌdɪsəˈpɔɪnt/","pos":"họ từ","vi":"disappoint (v) làm thất vọng · disappointment (n) sự thất vọng · disappointed (adj) thất vọng · disappointing (adj) đáng thất vọng","ex":"The result was disappointing.","exVi":"Kết quả thật đáng thất vọng.","note":""},{"en":"embarrass","ipa":"/ɪmˈbærəs/","pos":"họ từ","vi":"embarrass (v) làm ngượng · embarrassment (n) sự ngượng · embarrassed (adj) thấy ngượng · embarrassing (adj) đáng ngượng","ex":"It was an embarrassing mistake.","exVi":"Đó là một lỗi đáng ngượng.","note":""},{"en":"confident","ipa":"/ˈkɒnfɪdənt/","pos":"họ từ","vi":"confident (adj) tự tin · confidence (n) sự tự tin · confidently (adv) một cách tự tin","ex":"She spoke confidently in the interview.","exVi":"Cô ấy nói một cách tự tin trong buổi phỏng vấn.","note":""},{"en":"anxious","ipa":"/ˈæŋkʃəs/","pos":"họ từ","vi":"anxious (adj) lo lắng · anxiety (n) sự lo lắng · anxiously (adv) một cách lo lắng","ex":"He waited anxiously for the result.","exVi":"Cậu ấy chờ kết quả trong lo lắng.","note":""},{"en":"important","ipa":"/ɪmˈpɔːtnt/","pos":"họ từ","vi":"important (adj) quan trọng · importance (n) tầm quan trọng · importantly (adv) một cách quan trọng","ex":"Sleep is of great importance before an exam.","exVi":"Giấc ngủ rất quan trọng trước kỳ thi.","note":""},{"en":"necessary","ipa":"/ˈnesəsəri/","pos":"họ từ","vi":"necessary (adj) cần thiết · necessity (n) điều cần thiết · necessarily (adv) nhất thiết","ex":"A visa is not necessarily required.","exVi":"Không phải lúc nào cũng bắt buộc có visa.","note":""},{"en":"possible","ipa":"/ˈpɒsəbl/","pos":"họ từ","vi":"possible (adj) có thể · possibility (n) khả năng · possibly (adv) có thể · impossible (adj) không thể","ex":"There is a possibility of rain tomorrow.","exVi":"Có khả năng ngày mai mưa.","note":""},{"en":"responsible","ipa":"/rɪˈspɒnsəbl/","pos":"họ từ","vi":"responsible (adj) có trách nhiệm · responsibility (n) trách nhiệm · responsibly (adv) một cách có trách nhiệm","ex":"Use social media responsibly.","exVi":"Hãy dùng mạng xã hội một cách có trách nhiệm.","note":""},{"en":"convenient","ipa":"/kənˈviːniənt/","pos":"họ từ","vi":"convenient (adj) thuận tiện · convenience (n) sự thuận tiện · conveniently (adv) một cách thuận tiện","ex":"The station is conveniently near the school.","exVi":"Nhà ga thuận tiện vì gần trường.","note":""},{"en":"danger","ipa":"/ˈdeɪndʒə/","pos":"họ từ","vi":"danger (n) mối nguy · dangerous (adj) nguy hiểm · dangerously (adv) một cách nguy hiểm · endanger (v) gây nguy hiểm","ex":"Swimming here is dangerous.","exVi":"Bơi ở đây thì nguy hiểm.","note":""},{"en":"health","ipa":"/helθ/","pos":"họ từ","vi":"health (n) sức khỏe · healthy (adj) khỏe, lành mạnh · healthily (adv) một cách lành mạnh · unhealthy (adj) không lành mạnh","ex":"They eat healthily during exam week.","exVi":"Họ ăn uống lành mạnh trong tuần thi.","note":""},{"en":"nation","ipa":"/ˈneɪʃn/","pos":"họ từ","vi":"nation (n) quốc gia · national (adj) thuộc quốc gia · nationality (n) quốc tịch · international (adj) quốc tế","ex":"English is an international language.","exVi":"Tiếng Anh là một ngôn ngữ quốc tế.","note":""},{"en":"culture","ipa":"/ˈkʌltʃə/","pos":"họ từ","vi":"culture (n) văn hóa · cultural (adj) thuộc văn hóa · culturally (adv) về mặt văn hóa","ex":"Tet is a cultural event.","exVi":"Tết là một sự kiện văn hóa.","note":""},{"en":"history","ipa":"/ˈhɪstri/","pos":"họ từ","vi":"history (n) lịch sử · historian (n) nhà sử học · historic (adj) có tầm lịch sử · historical (adj) thuộc lịch sử · historically (adv) về mặt lịch sử","ex":"We visited a historical site.","exVi":"Chúng tôi đã thăm một di tích lịch sử.","note":""},{"en":"science","ipa":"/ˈsaɪəns/","pos":"họ từ","vi":"science (n) khoa học · scientist (n) nhà khoa học · scientific (adj) khoa học · scientifically (adv) một cách khoa học","ex":"She wants to become a scientist.","exVi":"Cô ấy muốn trở thành nhà khoa học.","note":""},{"en":"invent","ipa":"/ɪnˈvent/","pos":"họ từ","vi":"invent (v) phát minh · invention (n) phát minh · inventor (n) nhà phát minh · inventive (adj) hay phát minh","ex":"The inventor presented a new device.","exVi":"Nhà phát minh đã giới thiệu một thiết bị mới.","note":""},{"en":"discover","ipa":"/dɪˈskʌvə/","pos":"họ từ","vi":"discover (v) khám phá, phát hiện · discovery (n) sự phát hiện · discoverer (n) người phát hiện","ex":"The discovery of the cave surprised the village.","exVi":"Việc phát hiện hang làm cả làng ngạc nhiên.","note":""},{"en":"suggest","ipa":"/səˈdʒest/","pos":"họ từ","vi":"suggest (v) đề xuất · suggestion (n) lời đề xuất","ex":"Her suggestion was useful.","exVi":"Đề xuất của cô ấy có ích.","note":"suggest + V-ing, hoặc suggest that + chủ ngữ + (should) + V. Không nói suggest to V."},{"en":"compete","ipa":"/kəmˈpiːt/","pos":"họ từ","vi":"compete (v) thi đấu · competition (n) cuộc thi · competitive (adj) có tính ganh đua · competitor (n) người thi","ex":"She won the English competition.","exVi":"Cô ấy đã thắng cuộc thi tiếng Anh.","note":""},{"en":"apply","ipa":"/əˈplaɪ/","pos":"họ từ","vi":"apply (v) nộp đơn; áp dụng · application (n) đơn; ứng dụng · applicant (n) người nộp đơn","ex":"The applicant arrived early for the interview.","exVi":"Người nộp đơn đến sớm để phỏng vấn.","note":""},{"en":"qualify","ipa":"/ˈkwɒlɪfaɪ/","pos":"họ từ","vi":"qualify (v) đủ điều kiện · qualification (n) bằng cấp · qualified (adj) đủ trình độ","ex":"You need a qualification for this job.","exVi":"Bạn cần bằng cấp cho công việc này.","note":""},{"en":"achieve","ipa":"/əˈtʃiːv/","pos":"họ từ","vi":"achieve (v) đạt được · achievement (n) thành tích","ex":"Passing the exam was a real achievement.","exVi":"Đậu kỳ thi là một thành tích thật sự.","note":""},{"en":"explore","ipa":"/ɪkˈsplɔː/","pos":"họ từ","vi":"explore (v) khám phá · explorer (n) nhà thám hiểm · exploration (n) sự khám phá","ex":"The exploration lasted three days.","exVi":"Cuộc khám phá kéo dài ba ngày.","note":""},{"en":"permit","ipa":"/pəˈmɪt/","pos":"họ từ","vi":"permit (v) /pəˈmɪt/ cho phép · permit (n) /ˈpɜːmɪt/ giấy phép · permission (n) /pəˈmɪʃn/ sự cho phép","ex":"You need permission to camp here.","exVi":"Bạn cần sự cho phép để cắm trại ở đây.","note":""},{"en":"locate","ipa":"/ləʊˈkeɪt/","pos":"họ từ","vi":"locate (v) xác định vị trí · location (n) địa điểm","ex":"The location of the hotel is on the map.","exVi":"Vị trí khách sạn có trên bản đồ.","note":""},{"en":"preserve","ipa":"/prɪˈzɜːv/","pos":"họ từ","vi":"preserve (v) bảo tồn · preservation (n) sự bảo tồn","ex":"The preservation of the old houses is important.","exVi":"Việc bảo tồn những ngôi nhà cũ là quan trọng.","note":""},{"en":"contribute","ipa":"/kənˈtrɪbjuːt/","pos":"họ từ","vi":"contribute (v) đóng góp · contribution (n) sự đóng góp","ex":"Thank you for your contribution to the festival.","exVi":"Cảm ơn sự đóng góp của bạn cho lễ hội.","note":""},{"en":"recognise","ipa":"/ˈrekəɡnaɪz/","pos":"họ từ","vi":"recognise (v) công nhận; nhận ra · recognition (n) sự công nhận","ex":"The site received international recognition.","exVi":"Di tích đã được công nhận ở tầm quốc tế.","note":""},{"en":"promote","ipa":"/prəˈməʊt/","pos":"họ từ","vi":"promote (v) thúc đẩy, quảng bá · promotion (n) sự quảng bá; sự thăng chức","ex":"The promotion of local crafts helps the village.","exVi":"Việc quảng bá nghề thủ công giúp ngôi làng.","note":""},{"en":"advise","ipa":"/ədˈvaɪz/","pos":"họ từ","vi":"advise (v) khuyên · advice (n) /ədˈvaɪs/ lời khuyên · adviser hoặc advisor (n) người khuyên","ex":"She gave me useful advice.","exVi":"Cô ấy đã cho tôi một lời khuyên hữu ích.","note":"advice không đếm được và không có dạng số nhiều advices. Động từ mới là advise."},{"en":"practise","ipa":"/ˈpræktɪs/","pos":"họ từ","vi":"practise (v, Anh-Anh) luyện tập · practice (n) sự luyện tập. Anh-Mỹ dùng practice cho cả động từ lẫn danh từ","ex":"Daily practice makes you more fluent.","exVi":"Luyện mỗi ngày giúp bạn trôi chảy hơn.","note":""}]},{"id":"trap","part":15,"ky":0,"weeks":"","unit":null,"titleVi":"Cặp từ dễ học sai","titleEn":"Words students often mix up","kind":"exam","blurb":"Trang này chặn các nghĩa lệch. Học đúng cặp, đừng đổi cột cho nhau.","entries":[{"en":"affect / effect","ipa":"/əˈfekt/ · /ɪˈfekt/","pos":"dễ nhầm","vi":"affect là động từ: tác động, làm ảnh hưởng. effect là danh từ: hậu quả, tác dụng. Cụm đúng: have an effect on.","ex":"Lack of sleep affects your memory. The effect is serious.","exVi":"Thiếu ngủ ảnh hưởng đến trí nhớ. Hậu quả thì nghiêm trọng.","note":""},{"en":"rise / raise","ipa":"/raɪz/ · /reɪz/","pos":"dễ nhầm","vi":"rise tự tăng, không cần tân ngữ: rose / risen. raise nâng một cái gì đó, có tân ngữ: raised / raised.","ex":"Prices rose last year. The school raised money for the trip.","exVi":"Giá đã tăng năm ngoái. Nhà trường đã gây quỹ cho chuyến đi.","note":""},{"en":"say / tell / speak / talk","ipa":"/seɪ/ · /tel/ · /spiːk/ · /tɔːk/","pos":"dễ nhầm","vi":"say nói một lời (say something). tell kể hoặc bảo ai (tell somebody something). speak nói một ngôn ngữ hoặc phát biểu. talk nói chuyện (talk to/with somebody about something).","ex":"She said goodbye. He told me the truth. They speak English. We talked about the trip.","exVi":"Cô ấy nói lời tạm biệt. Anh ấy nói với tôi sự thật. Họ nói tiếng Anh. Chúng tôi nói về chuyến đi.","note":""},{"en":"borrow / lend","ipa":"/ˈbɒrəʊ/ · /lend/","pos":"dễ nhầm","vi":"borrow mượn vào (borrow something from somebody). lend cho mượn (lend somebody something).","ex":"I borrowed a pen from Lan. Lan lent me a pen.","exVi":"Tôi mượn bút của Lan. Lan cho tôi mượn bút.","note":""},{"en":"job / work / career","ipa":"/dʒɒb/ · /wɜːk/ · /kəˈrɪə/","pos":"dễ nhầm","vi":"job là một việc làm, đếm được. work là công việc nói chung, không đếm được. career là sự nghiệp dài.","ex":"He has two jobs. The work is tiring. She wants a career in design.","exVi":"Anh ấy có hai việc. Công việc thì mệt. Cô ấy muốn sự nghiệp thiết kế.","note":"Không nói a work khi nghĩa là một công việc. Nói a job."},{"en":"trip / journey / travel","ipa":"/trɪp/ · /ˈdʒɜːni/ · /ˈtrævl/","pos":"dễ nhầm","vi":"trip là một chuyến đi và về. journey là hành trình, chặng đường. travel là việc đi lại nói chung, thường không đếm được.","ex":"Our class trip was fun. The journey took eight hours. She loves travel.","exVi":"Chuyến đi của lớp rất vui. Hành trình mất tám tiếng. Cô ấy thích đi du lịch.","note":""},{"en":"historic / historical","ipa":"/hɪˈstɒrɪk/ · /hɪˈstɒrɪkl/","pos":"dễ nhầm","vi":"historic = có tầm quan trọng lịch sử. historical = thuộc về lịch sử, liên quan đến lịch sử.","ex":"1975 is a historic year. We read a historical story.","exVi":"Năm 1975 là một năm có tầm lịch sử. Chúng tôi đọc một truyện về lịch sử.","note":""},{"en":"economic / economical","ipa":"/ˌiːkəˈnɒmɪk/ · /ˌiːkəˈnɒmɪkl/","pos":"dễ nhầm","vi":"economic thuộc kinh tế. economical tiết kiệm, không lãng phí.","ex":"Tourism supports economic growth. Buses are more economical than taxis.","exVi":"Du lịch hỗ trợ tăng trưởng kinh tế. Xe buýt tiết kiệm hơn taxi.","note":""},{"en":"electrical / electronic","ipa":"/ɪˈlektrɪkl/ · /ɪˌlekˈtrɒnɪk/","pos":"dễ nhầm","vi":"electrical chạy bằng điện hoặc thuộc điện. electronic là điện tử, có chip hoặc mạch.","ex":"A fan is electrical. A smartphone is electronic.","exVi":"Quạt chạy bằng điện. Điện thoại thông minh là thiết bị điện tử.","note":""},{"en":"interested / interesting","ipa":"/ˈɪntrəstɪd/ · /ˈɪntrəstɪŋ/","pos":"dễ nhầm","vi":"interested là cảm xúc của người. interesting là tính chất của việc hoặc vật. Cùng kiểu: bored / boring, excited / exciting, disappointed / disappointing.","ex":"I am interested in history. The lesson is interesting.","exVi":"Tôi thích lịch sử. Bài học thì thú vị.","note":"interested in + danh từ hoặc V-ing."},{"en":"because / because of","ipa":"/bɪˈkɒz/ · /bɪˈkɒz əv/","pos":"dễ nhầm","vi":"because + cả một mệnh đề (có chủ ngữ và động từ). because of + danh từ hoặc cụm danh từ.","ex":"We stayed home because it rained. We stayed home because of the rain.","exVi":"Chúng tôi ở nhà vì trời mưa.","note":""},{"en":"although / despite","ipa":"/ɔːlˈðəʊ/ · /dɪˈspaɪt/","pos":"dễ nhầm","vi":"although + mệnh đề. despite hoặc in spite of + danh từ. Không nói despite of.","ex":"Although it rained, we went out. Despite the rain, we went out.","exVi":"Dù mưa, chúng tôi vẫn ra ngoài.","note":""},{"en":"used to / be used to","ipa":"/ˈjuːst tuː/","pos":"dễ nhầm","vi":"used to + V nguyên mẫu: đã từng (thói quen quá khứ, nay không còn). be used to + V-ing hoặc danh từ: quen với.","ex":"I used to walk to school. I am used to getting up early.","exVi":"Tôi đã từng đi bộ đến trường. Tôi quen dậy sớm.","note":""},{"en":"few / a few / little / a little","ipa":"/fjuː/ · /ˈlɪtl/","pos":"dễ nhầm","vi":"few và a few đi với danh từ đếm được. little và a little đi với danh từ không đếm được. few / little nghiêng về ít đến mức thiếu. a few / a little là một ít, vẫn có.","ex":"Few students failed. A few students got full marks. There is little time. We still have a little time.","exVi":"Ít học sinh trượt. Một vài học sinh được điểm tuyệt đối. Còn rất ít thời gian. Chúng ta vẫn còn một ít thời gian.","note":""},{"en":"advice / advise","ipa":"/ədˈvaɪs/ · /ədˈvaɪz/","pos":"dễ nhầm","vi":"advice là danh từ, không đếm được. advise là động từ.","ex":"She gave me advice. She advised me to sleep early.","exVi":"Cô ấy cho tôi lời khuyên. Cô ấy khuyên tôi ngủ sớm.","note":""},{"en":"listen / hear","ipa":"/ˈlɪsn/ · /hɪə/","pos":"dễ nhầm","vi":"listen to là chủ động lắng nghe. hear là nghe thấy, tai nhận được âm thanh.","ex":"Listen to the teacher. I heard a noise.","exVi":"Hãy lắng nghe thầy cô. Tôi nghe thấy một tiếng động.","note":"listen luôn cần to khi có tân ngữ: listen to music."},{"en":"look / see / watch","ipa":"/lʊk/ · /siː/ · /wɒtʃ/","pos":"dễ nhầm","vi":"look at là hướng mắt nhìn. see là nhìn thấy. watch là xem một cái đang diễn ra (phim, trận đấu).","ex":"Look at the board. I saw Lan at the gate. We watched a documentary.","exVi":"Hãy nhìn lên bảng. Tôi thấy Lan ở cổng. Chúng tôi xem một phim tài liệu.","note":""},{"en":"win / beat","ipa":"/wɪn/ · /biːt/","pos":"dễ nhầm","vi":"win + giải, trận, cuộc thi. beat + đối thủ.","ex":"Our team won the match. We beat the other class.","exVi":"Đội chúng tôi thắng trận. Chúng tôi thắng lớp kia.","note":""},{"en":"do / make","ipa":"/duː/ · /meɪk/","pos":"dễ nhầm","vi":"do đi với việc, bài, nhiệm vụ: do homework, do the washing, do someone a favour. make đi với thứ được tạo ra hoặc một quyết định: make a mistake, make a decision, make progress, make an effort.","ex":"I do my homework after dinner. Do not make a mistake with the tense.","exVi":"Tôi làm bài tập sau bữa tối. Đừng mắc lỗi về thì.","note":""},{"en":"remember / remind","ipa":"/rɪˈmembə/ · /rɪˈmaɪnd/","pos":"dễ nhầm","vi":"remember là tự mình nhớ. remind là làm người khác nhớ: remind somebody to V, remind somebody of something.","ex":"I remember the story. Please remind me to call her.","exVi":"Tôi nhớ câu chuyện. Nhờ nhắc tôi gọi cho cô ấy.","note":""},{"en":"house / home","ipa":"/haʊs/ · /həʊm/","pos":"dễ nhầm","vi":"house là ngôi nhà, công trình. home là nhà theo nghĩa nơi mình thuộc về.","ex":"They bought a new house. I want to go home.","exVi":"Họ mua một ngôi nhà mới. Tôi muốn về nhà.","note":""},{"en":"cook / cooker","ipa":"/kʊk/ · /ˈkʊkə/","pos":"dễ nhầm","vi":"cook là người nấu ăn, hoặc động từ nấu. cooker là bếp, nồi để nấu.","ex":"My mother is a good cook. The cooker is in the kitchen.","exVi":"Mẹ tôi nấu ăn ngon. Cái bếp ở trong nhà bếp.","note":""},{"en":"cloth / clothes","ipa":"/klɒθ/ · /kləʊðz/","pos":"dễ nhầm","vi":"cloth là vải. clothes là quần áo, luôn ở dạng số nhiều.","ex":"This cloth is silk. These clothes are new.","exVi":"Tấm vải này là lụa. Bộ quần áo này là mới.","note":""},{"en":"sensible / sensitive","ipa":"/ˈsensəbl/ · /ˈsensətɪv/","pos":"dễ nhầm","vi":"sensible biết điều, có lý. sensitive nhạy cảm.","ex":"It is sensible to sleep early. She is sensitive to loud noise.","exVi":"Ngủ sớm là biết điều. Cô ấy nhạy cảm với tiếng ồn lớn.","note":""},{"en":"principal / principle","ipa":"/ˈprɪnsəpl/ · /ˈprɪnsəpl/","pos":"dễ nhầm","vi":"principal (n) hiệu trưởng; (adj) chính. principle (n) nguyên tắc.","ex":"The principal spoke at the ceremony. Honesty is an important principle.","exVi":"Hiệu trưởng đã phát biểu tại lễ. Trung thực là một nguyên tắc quan trọng.","note":"Hai từ đồng âm. Nghĩa khác hẳn nhau."},{"en":"loose / lose","ipa":"/luːs/ · /luːz/","pos":"dễ nhầm","vi":"loose là tính từ: lỏng. lose là động từ: làm mất; thua. Quá khứ của lose là lost.","ex":"This shirt is loose. Do not lose your ticket.","exVi":"Áo này rộng. Đừng làm mất vé.","note":""},{"en":"quiet / quite","ipa":"/ˈkwaɪət/ · /kwaɪt/","pos":"dễ nhầm","vi":"quiet là yên tĩnh. quite là khá.","ex":"The library is quiet. The test was quite difficult.","exVi":"Thư viện yên tĩnh. Bài kiểm tra khá khó.","note":""},{"en":"beside / besides","ipa":"/bɪˈsaɪd/ · /bɪˈsaɪdz/","pos":"dễ nhầm","vi":"beside = bên cạnh. besides = ngoài ra.","ex":"Sit beside me. Besides English, she studies music.","exVi":"Ngồi cạnh tôi. Ngoài tiếng Anh, cô ấy còn học nhạc.","note":""},{"en":"expect / wait","ipa":"/ɪkˈspekt/ · /weɪt/","pos":"dễ nhầm","vi":"expect trông đợi một việc sẽ xảy ra, không cần for. wait for chờ đợi ai hoặc cái gì.","ex":"I expect good results. We waited for the bus.","exVi":"Tôi trông đợi kết quả tốt. Chúng tôi đã chờ xe buýt.","note":""},{"en":"chance / opportunity","ipa":"/tʃɑːns/ · /ˌɒpəˈtjuːnəti/","pos":"dễ nhầm","vi":"opportunity là cơ hội thuận lợi để làm một việc. chance có thể là cơ hội, hoặc là khả năng xảy ra.","ex":"She has an opportunity to study abroad. There is a chance of rain.","exVi":"Cô ấy có cơ hội học ở nước ngoài. Có khả năng mưa.","note":""},{"en":"customer / client","ipa":"/ˈkʌstəmə/ · /ˈklaɪənt/","pos":"dễ nhầm","vi":"customer là khách mua hàng ở cửa hàng. client là thân chủ của một dịch vụ chuyên môn, như luật sư hoặc công ty.","ex":"The customer paid the cashier. The lawyer met her client.","exVi":"Khách đã trả tiền cho thu ngân. Luật sư đã gặp thân chủ.","note":""},{"en":"desert / dessert","ipa":"/ˈdezət/ · /dɪˈzɜːt/","pos":"dễ nhầm","vi":"desert nhấn âm đầu: sa mạc. dessert nhấn âm sau: món tráng miệng.","ex":"Camels live in the desert. We had fruit for dessert.","exVi":"Lạc đà sống ở sa mạc. Chúng tôi ăn trái cây làm món tráng miệng.","note":""}]},{"id":"pattern","part":16,"ky":0,"weeks":"","unit":null,"titleVi":"Cấu trúc bắt buộc đi với từ","titleEn":"Patterns that cost marks","kind":"exam","blurb":"Thi vào 10 trừ điểm nếu đúng từ nhưng sai cấu trúc theo sau. Học nguyên cả cụm.","entries":[{"en":"look forward to + V-ing","ipa":"/lʊk ˈfɔːwəd tuː/","pos":"cấu trúc","vi":"mong đợi. Sau to là danh từ hoặc V-ing, không phải động từ nguyên mẫu.","ex":"I look forward to visiting Hue.","exVi":"Tôi mong được đến thăm Huế.","note":""},{"en":"suggest + V-ing","ipa":"/səˈdʒest/","pos":"cấu trúc","vi":"đề xuất. suggest doing something, hoặc suggest that somebody (should) do something.","ex":"She suggested taking the metro.","exVi":"Cô ấy đề xuất đi tàu điện ngầm.","note":""},{"en":"avoid / enjoy / mind / finish + V-ing","ipa":"/əˈvɔɪd/","pos":"cấu trúc","vi":"avoid tránh, enjoy thích, mind phiền, finish kết thúc: cả bốn đi với V-ing.","ex":"Avoid staying up late. Do you mind opening the window?","exVi":"Hãy tránh thức khuya. Bạn có phiền mở cửa sổ không?","note":""},{"en":"decide / want / hope / plan + to-V","ipa":"/dɪˈsaɪd/","pos":"cấu trúc","vi":"quyết định, muốn, hy vọng, dự định: đi với to + động từ nguyên mẫu.","ex":"They decided to book the tour early.","exVi":"Họ quyết định đặt tour sớm.","note":""},{"en":"Wh- + to-V","ipa":"/tuː/","pos":"cấu trúc","vi":"Unit 1: what / where / how / who + to-V, nghĩa là việc nên làm.","ex":"I do not know where to buy the conical hat.","exVi":"Tôi không biết mua nón lá ở đâu.","note":""},{"en":"the + comparative, the + comparative","ipa":"/kəmˈpærətɪv/","pos":"cấu trúc","vi":"Unit 2, so sánh kép: càng... càng...","ex":"The more you practise, the better you speak.","exVi":"Bạn càng luyện thì càng nói tốt.","note":""},{"en":"wish + past simple","ipa":"/wɪʃ/","pos":"cấu trúc","vi":"Unit 4: wish + quá khứ đơn diễn tả điều ước trái với hiện tại. Động từ be dùng were cho mọi ngôi trong câu trang trọng.","ex":"I wish I had more time to revise.","exVi":"Tôi ước tôi có thêm thời gian để ôn.","note":""},{"en":"used to + V","ipa":"/ˈjuːst tuː/","pos":"cấu trúc","vi":"đã từng, thói quen trong quá khứ nay không còn. Phủ định: did not use to.","ex":"People used to travel by bicycle more often.","exVi":"Ngày xưa người ta thường đi xe đạp hơn.","note":""},{"en":"be used to + V-ing","ipa":"/ˈjuːst tuː/","pos":"cấu trúc","vi":"quen với. Khác hẳn used to + V.","ex":"She is used to getting up early.","exVi":"Cô ấy quen dậy sớm.","note":""},{"en":"apply for + noun","ipa":"/əˈplaɪ fɔː/","pos":"cấu trúc","vi":"nộp đơn xin một việc hoặc một suất.","ex":"He applied for a part-time job.","exVi":"Cậu ấy đã nộp đơn xin việc bán thời gian.","note":""},{"en":"be good at / be interested in + V-ing","ipa":"/ɡʊd æt/","pos":"cấu trúc","vi":"giỏi về; thích. Sau giới từ là danh từ hoặc V-ing.","ex":"She is good at solving problems. He is interested in design.","exVi":"Cô ấy giỏi giải quyết vấn đề. Cậu ấy thích thiết kế.","note":""},{"en":"succeed in + V-ing","ipa":"/səkˈsiːd ɪn/","pos":"cấu trúc","vi":"làm thành công một việc.","ex":"He succeeded in passing the exam.","exVi":"Anh ấy đã đậu kỳ thi.","note":""},{"en":"prevent somebody from + V-ing","ipa":"/prɪˈvent/","pos":"cấu trúc","vi":"ngăn ai làm gì.","ex":"The storm prevented us from going out.","exVi":"Cơn bão ngăn chúng tôi ra ngoài.","note":""},{"en":"consist of","ipa":"/kənˈsɪst əv/","pos":"cấu trúc","vi":"gồm. Không có bị động *is consisted of.","ex":"The team consists of six students.","exVi":"Đội gồm sáu học sinh.","note":""},{"en":"too + adj + to-V","ipa":"/tuː/","pos":"cấu trúc","vi":"quá... đến mức không thể...","ex":"The box is too heavy to carry.","exVi":"Hộp quá nặng nên không mang được.","note":""},{"en":"adj + enough + to-V","ipa":"/ɪˈnʌf/","pos":"cấu trúc","vi":"đủ... để.... enough đứng sau tính từ.","ex":"She is old enough to travel alone.","exVi":"Cô ấy đủ lớn để đi một mình.","note":"Danh từ thì enough đứng trước: enough time. Tính từ thì enough đứng sau: old enough."},{"en":"make somebody + V","ipa":"/meɪk/","pos":"cấu trúc","vi":"khiến ai làm gì. Động từ sau somebody để nguyên mẫu, không có to.","ex":"The news made us smile.","exVi":"Tin đó khiến chúng tôi mỉm cười.","note":""},{"en":"let somebody + V","ipa":"/let/","pos":"cấu trúc","vi":"cho phép ai làm gì. Động từ sau để nguyên mẫu không to.","ex":"The guide let us take photos.","exVi":"Hướng dẫn viên cho chúng tôi chụp ảnh.","note":""},{"en":"spend time + V-ing","ipa":"/spend/","pos":"cấu trúc","vi":"dành thời gian để làm gì.","ex":"We spent two hours exploring the cave.","exVi":"Chúng tôi dành hai giờ khám phá hang.","note":""},{"en":"it takes somebody + time + to-V","ipa":"/teɪks/","pos":"cấu trúc","vi":"ai đó mất bao lâu để làm gì.","ex":"It takes me twenty minutes to get to school.","exVi":"Tôi mất hai mươi phút để đến trường.","note":""}]},{"id":"colloc","part":17,"ky":0,"weeks":"","unit":null,"titleVi":"Cụm từ cố định hay ra đề","titleEn":"Collocations","kind":"exam","blurb":"Học cả cụm. Đổi động từ hoặc giới từ là sai, dù từng từ riêng vẫn đúng nghĩa.","entries":[{"en":"make a decision","ipa":"/meɪk ə dɪˈsɪʒn/","pos":"cụm","vi":"đưa ra quyết định","ex":"We need to make a decision today.","exVi":"Chúng ta cần quyết định hôm nay.","note":""},{"en":"make progress","ipa":"/meɪk ˈprəʊɡres/","pos":"cụm","vi":"tiến bộ","ex":"She has made progress in pronunciation.","exVi":"Cô ấy đã tiến bộ về phát âm.","note":""},{"en":"make an effort","ipa":"/meɪk ən ˈefət/","pos":"cụm","vi":"nỗ lực","ex":"Make an effort to speak English in class.","exVi":"Hãy cố nói tiếng Anh trên lớp.","note":""},{"en":"make a mistake","ipa":"/meɪk ə mɪˈsteɪk/","pos":"cụm","vi":"mắc lỗi","ex":"I made a mistake with the tense.","exVi":"Tôi đã mắc lỗi về thì.","note":""},{"en":"do homework","ipa":"/duː ˈhəʊmwɜːk/","pos":"cụm","vi":"làm bài tập về nhà","ex":"I do my homework before dinner.","exVi":"Tôi làm bài tập trước bữa tối.","note":"homework không đếm được."},{"en":"do someone a favour","ipa":"/duː ˈfeɪvə/","pos":"cụm","vi":"giúp ai một việc","ex":"Could you do me a favour and check this sentence?","exVi":"Bạn làm ơn kiểm tra câu này được không?","note":""},{"en":"take part in","ipa":"/teɪk pɑːt ɪn/","pos":"cụm","vi":"tham gia vào một hoạt động","ex":"Will you take part in the contest?","exVi":"Bạn có tham gia cuộc thi không?","note":""},{"en":"take a photo","ipa":"/teɪk ə ˈfəʊtəʊ/","pos":"cụm","vi":"chụp ảnh","ex":"May I take a photo of the craft?","exVi":"Tôi chụp ảnh món đồ thủ công được không?","note":""},{"en":"pay attention to","ipa":"/peɪ əˈtenʃn tuː/","pos":"cụm","vi":"chú ý đến","ex":"Pay attention to the word form.","exVi":"Hãy chú ý đến dạng của từ.","note":""},{"en":"have an effect on","ipa":"/həv ən ɪˈfekt ɒn/","pos":"cụm","vi":"có tác động đến","ex":"Tourism has an effect on local life.","exVi":"Du lịch có tác động đến đời sống địa phương.","note":""},{"en":"have difficulty in","ipa":"/dɪˈfɪkəlti/","pos":"cụm","vi":"gặp khó khăn trong việc. Cũng nói have difficulty + V-ing","ex":"He has difficulty in pronouncing this word.","exVi":"Cậu ấy gặp khó khi phát âm từ này.","note":""},{"en":"be famous for","ipa":"/ˈfeɪməs fɔː/","pos":"cụm","vi":"nổi tiếng về","ex":"The village is famous for pottery.","exVi":"Ngôi làng nổi tiếng về đồ gốm.","note":""},{"en":"be proud of","ipa":"/praʊd əv/","pos":"cụm","vi":"tự hào về","ex":"We are proud of our local culture.","exVi":"Chúng tôi tự hào về văn hóa địa phương.","note":""},{"en":"be responsible for","ipa":"/rɪˈspɒnsəbl fɔː/","pos":"cụm","vi":"chịu trách nhiệm về","ex":"The guide is responsible for the group.","exVi":"Hướng dẫn viên chịu trách nhiệm về cả nhóm.","note":""},{"en":"be keen on","ipa":"/kiːn ɒn/","pos":"cụm","vi":"say mê","ex":"She is keen on photography.","exVi":"Cô ấy say mê nhiếp ảnh.","note":""},{"en":"heavy traffic","ipa":"/ˈhevi ˈtræfɪk/","pos":"cụm","vi":"giao thông đông, ùn tắc","ex":"We were late because of heavy traffic.","exVi":"Chúng tôi muộn vì đường đông.","note":"traffic đi với heavy, không nói crowded traffic trong cách nói chuẩn."},{"en":"heavy rain","ipa":"/ˈhevi reɪn/","pos":"cụm","vi":"mưa to","ex":"Heavy rain caused a flood.","exVi":"Mưa to gây lũ.","note":""},{"en":"strong wind","ipa":"/strɒŋ wɪnd/","pos":"cụm","vi":"gió mạnh","ex":"A strong wind blew all night.","exVi":"Gió mạnh thổi suốt đêm.","note":""},{"en":"public transport","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","pos":"cụm","vi":"giao thông công cộng","ex":"Public transport reduces pollution.","exVi":"Giao thông công cộng làm giảm ô nhiễm.","note":""},{"en":"environmental problem","ipa":"/ɪnˌvaɪrənˈmentl ˈprɒbləm/","pos":"cụm","vi":"vấn đề môi trường","ex":"Air pollution is a serious environmental problem.","exVi":"Ô nhiễm không khí là một vấn đề môi trường nghiêm trọng.","note":""},{"en":"fast food","ipa":"/fɑːst fuːd/","pos":"cụm","vi":"đồ ăn nhanh","ex":"Too much fast food is unhealthy.","exVi":"Ăn quá nhiều đồ ăn nhanh thì không tốt.","note":""},{"en":"natural disaster","ipa":"/ˌnætʃrəl dɪˈzɑːstə/","pos":"cụm","vi":"thảm họa thiên nhiên","ex":"A flood is a natural disaster.","exVi":"Lũ là một thảm họa thiên nhiên.","note":""},{"en":"renewable energy","ipa":"/rɪˈnjuːəbl ˈenədʒi/","pos":"cụm","vi":"năng lượng tái tạo","ex":"The town uses renewable energy.","exVi":"Thị trấn dùng năng lượng tái tạo.","note":""},{"en":"endangered species","ipa":"/ɪnˈdeɪndʒəd ˈspiːʃiːz/","pos":"cụm","vi":"loài có nguy cơ tuyệt chủng","ex":"We should protect endangered species.","exVi":"Chúng ta nên bảo vệ các loài có nguy cơ tuyệt chủng.","note":""}]}]}</script>
<script>
const BOOK = JSON.parse(document.getElementById("book-data").textContent);
const KEY = "lop9-study-v1";
const rows = [];
const byId = new Map();
for (const section of BOOK.sections) {
  for (const entry of section.entries) {
    const id = section.id + "::" + entry.en;
    const row = { id, section, entry };
    rows.push(row);
    byId.set(id, row);
  }
}

const POS = { n: "danh từ", v: "động từ", adj: "tính từ", adv: "trạng từ", prep: "giới từ", conj: "liên từ", pron: "đại từ", "cụm": "cụm từ", "phr.v": "cụm động từ", "họ từ": "họ từ", "dễ nhầm": "cặp dễ nhầm", "cấu trúc": "cấu trúc" };
function posLabel(pos) { return POS[pos] || pos; }
function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
function todayKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function pad(n) { return String(n).padStart(2, "0"); }
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i += 1) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function defaultProgress() {
  return { cards: {}, days: [], lessonId: "u1", sessionSize: 8, remind: { on: true, hour: 19, minute: 30 }, countDate: "", todayCount: 0 };
}
function loadProgress() {
  const base = defaultProgress();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return base;
    const parsed = JSON.parse(raw);
    const size = parsed.sessionSize === 5 || parsed.sessionSize === 12 ? parsed.sessionSize : 8;
    return { ...base, ...parsed, cards: parsed.cards || {}, days: Array.isArray(parsed.days) ? parsed.days : [], remind: { ...base.remind, ...(parsed.remind || {}) }, sessionSize: size };
  } catch { return base; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(progress)); }
function streak(days, today) {
  const set = new Set(days);
  const cursor = new Date(today + "T12:00:00");
  if (!set.has(today)) cursor.setDate(cursor.getDate() - 1);
  let n = 0;
  while (n < 400 && set.has(todayKey(cursor))) { n += 1; cursor.setDate(cursor.getDate() - 1); }
  return n;
}
function markStudied(now) {
  const key = todayKey(now);
  if (!progress.days.includes(key)) progress.days = progress.days.concat(key).slice(-90);
  progress.todayCount = progress.countDate === key ? progress.todayCount + 1 : 1;
  progress.countDate = key;
}
function schedule(prev, q, now) {
  const ease0 = prev ? prev.ease : 2.5;
  if (q === 0) return { ease: Math.max(1.3, ease0 - 0.2), interval: 10 / 1440, due: now + 10 * 60 * 1000, reps: 0, lapses: (prev ? prev.lapses : 0) + 1 };
  const smq = q === 1 ? 3 : q === 2 ? 4 : 5;
  const ease = Math.max(1.3, ease0 + (0.1 - (5 - smq) * (0.08 + (5 - smq) * 0.02)));
  const reps = (prev ? prev.reps : 0) + 1;
  let interval;
  if (reps === 1) interval = q === 1 ? 0.5 : q === 3 ? 3 : 1;
  else if (reps === 2) interval = q === 1 ? 1 : q === 3 ? 7 : 3;
  else {
    const base = (prev && prev.interval > 0.2 ? prev.interval : 1) * ease;
    interval = q === 1 ? Math.max(0.5, base * 0.6) : q === 3 ? base * 1.3 : base;
  }
  return { ease, interval, due: now + interval * 86400000, reps, lapses: prev ? prev.lapses : 0 };
}
function whenLabel(days) {
  if (days < 0.03) return "vài phút nữa";
  if (days < 0.85) return "vài giờ nữa";
  if (days < 1.6) return "ngày mai";
  const rounded = Math.round(days);
  if (rounded < 7) return rounded + " ngày nữa";
  if (rounded < 13) return "tuần sau";
  return rounded + " ngày nữa";
}
function isDue(card, now) { return !!(card && card.reps > 0 && card.due <= now); }
function isFresh(card) { return !card || card.reps === 0; }
function pickPractice(ids, size, seed) {
  return ids.slice().sort((a, b) => hash(seed + a) - hash(seed + b)).slice(0, size);
}
function buildQueue(ids, mode, size, now, seed) {
  const cards = progress.cards;
  const due = ids.filter((id) => isDue(cards[id], now)).sort((a, b) => (cards[a].due || 0) - (cards[b].due || 0));
  const fresh = ids.filter((id) => isFresh(cards[id]));
  const work = due.concat(fresh);
  if (mode === "learn") return work.length ? work.slice(0, size) : pickPractice(ids, Math.min(size, ids.length), seed);
  if (mode === "cards") return (work.length ? work : ids).slice(0, size);
  if (work.length >= size) return work.slice(0, size);
  const rest = pickPractice(ids.filter((id) => work.indexOf(id) < 0), size - work.length, seed);
  return work.concat(rest).slice(0, size);
}
function buildReview(now, size) {
  return Object.entries(progress.cards).filter((pair) => isDue(pair[1], now)).sort((a, b) => a[1].due - b[1].due).slice(0, size).map((pair) => pair[0]);
}
function buildSteps(ids, mode) {
  if (mode === "cards") return ids.map((id) => ({ id, kind: "card" }));
  if (mode === "quiz" || mode === "review") return ids.map((id) => ({ id, kind: "ask" }));
  const steps = [];
  const wait = [];
  ids.forEach((id) => {
    if (isFresh(progress.cards[id])) {
      steps.push({ id, kind: "meet" });
      wait.push(id);
      if (wait.length >= 2) steps.push({ id: wait.shift(), kind: "ask" });
    } else steps.push({ id, kind: "ask" });
  });
  while (wait.length) steps.push({ id: wait.shift(), kind: "ask" });
  return steps;
}
function direction(id, card) {
  if (!card || card.reps < 2) return "en-vi";
  return hash(id) % 3 === 0 ? "vi-en" : "en-vi";
}
function qualityFrom(correct, hints) {
  if (!correct) return 0;
  if (hints <= 0) return 3;
  if (hints === 1) return 2;
  return 1;
}
function promptVi(vi) {
  const first = (vi.split(/(?<=\.)\s+/)[0] || vi).trim();
  return first.length <= 180 ? first : first.slice(0, 177) + "…";
}
function trimLen(s, n) { const t = s.trim(); return t.length <= n ? t : t.slice(0, n - 1) + "…"; }
function memoryHook(entry) {
  if (entry.note && entry.note.trim()) return entry.note.trim();
  if (entry.pos === "dễ nhầm" || entry.pos === "cấu trúc" || entry.pos === "họ từ") return trimLen(entry.vi, 200);
  if (entry.en.indexOf("/") < 0 && entry.en.indexOf("+") < 0) {
    const parts = entry.en.split(/\s+/).filter(Boolean);
    if (parts.length >= 2 && parts.length <= 4) return "Tách để nhớ: " + parts.join(" + ") + ".";
  }
  const vi = (entry.vi.split(".")[0] || entry.vi).trim();
  const said = entry.en.length > 32 ? entry.en.slice(0, 30) + "…" : entry.en;
  return "Đọc “" + said + "”, nói ngay “" + trimLen(vi, 90) + "”.";
}
function blankExample(entry) {
  const token = (entry.en.split(/[/+]/)[0] || entry.en).trim();
  const head = token.split(/\s+/)[0] || token;
  if (!head || head.length < 3) return entry.ex;
  const re = new RegExp(head.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
  return re.test(entry.ex) ? entry.ex.replace(re, "_____") : entry.ex;
}
function hintsFor(entry, dir) {
  const lines = ["Loại từ: " + posLabel(entry.pos) + "."];
  if (dir === "en-vi") {
    if (entry.ex) lines.push("Câu móc: " + entry.ex);
    if (entry.note && entry.note.trim()) lines.push(entry.note.trim());
    const letter = entry.vi.trim().charAt(0);
    if (letter) lines.push("Nghĩa bắt đầu bằng “" + letter + "”.");
    return lines;
  }
  const m = entry.en.match(/[A-Za-z]/);
  if (m) lines.push("Bắt đầu bằng chữ " + m[0].toUpperCase() + ".");
  if (entry.ipa) lines.push("Phiên âm: " + entry.ipa);
  if (entry.ex) lines.push("Câu có chỗ trống: " + blankExample(entry));
  if (entry.note && entry.note.trim()) lines.push(entry.note.trim());
  return lines;
}
function makeChoices(correct, pool, seed) {
  const seen = new Set([correct]);
  const uniq = [];
  pool.forEach((label) => {
    const t = String(label || "").trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    uniq.push(t);
  });
  const wrong = uniq.map((label) => ({ label, h: hash(seed + "|" + label) })).sort((a, b) => a.h - b.h).slice(0, 3).map((x) => ({ label: x.label, ok: false }));
  return wrong.concat([{ label: correct, ok: true }]).map((x) => ({ ...x, h: hash(seed + "~" + x.label) })).sort((a, b) => a.h - b.h).map((x) => ({ label: x.label, ok: x.ok }));
}
function greeting(d) {
  const h = d.getHours();
  if (h < 11) return "Chào buổi sáng";
  if (h < 14) return "Chào buổi trưa";
  if (h < 18) return "Chào buổi chiều";
  return "Chào buổi tối";
}
function wordClass(en) {
  if (en.length > 32) return "w-xl";
  if (en.length > 18) return "w-lg";
  return "w-hero";
}
function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = 0.92;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function icon(name) {
  const p = {
    cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
    vol: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>',
    bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a6 6 0 1 1 8 0c-.8.8-1.5 1.6-1.7 2.7H9.7C9.5 15.6 8.8 14.8 8 14z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (p[name] || "") + "</svg>";
}

let progress = loadProgress();

let filter = "all";

function lesson() { return BOOK.sections.find((s) => s.id === progress.lessonId) || BOOK.sections[0]; }

function stressIpa(ipa) {

  const at = shown.indexOf(mark[0]);
  return esc(shown.slice(0, at)) + '<b class="stress">ˈ' + esc(mark[1]) + "</b>" + esc(shown.slice(at + mark[0].length));
}
function highlightEx(entry) {
  const token = (entry.en.split(/[/+]/)[0] || entry.en).trim();
  const head = (token.split(/\s+/)[0] || "").replace(/[^A-Za-z'-]/g, "");
  if (!head || head.length < 3) return esc(entry.ex);
  const re = new RegExp("(" + head.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  const bits = String(entry.ex || "").split(re);
  if (bits.length < 2) return esc(entry.ex);
  return bits.map((part, i) => (i % 2 ? '<mark class="hit">' + esc(part) + "</mark>" : esc(part))).join("");
}
function confuseWith(row) {
  const mine = promptVi(row.entry.vi).toLowerCase().replace(/\./g, "").trim();
  if (mine.length < 8) return null;
  const others = rows.filter((r) => r.section.id === row.section.id && r.id !== row.id);
  for (let i = 0; i < others.length; i += 1) {
    const v = promptVi(others[i].entry.vi).toLowerCase().replace(/\./g, "").trim();
    if (v.length < 8 || v === mine) continue;
    if (mine.indexOf(v) >= 0 || v.indexOf(mine) >= 0) return others[i];
  }
  return null;
}
function gradeRecall(id, kind) {
  const prev = progress.cards[id];
  const day = 86400000;
  let interval = 7;
  let reps = 1;
  let lapses = prev ? prev.lapses : 0;
  if (kind === "forget") { interval = 1; reps = 1; lapses += 1; }
  else if (kind === "fuzzy") { interval = 3; reps = 1; }
  else {
    interval = prev && prev.interval >= 7 ? 14 : 7;
    reps = interval >= 14 ? Math.max(2, (prev ? prev.reps : 0) + 1) : Math.max(1, (prev ? prev.reps : 0) + 1);
  }
  progress.cards[id] = { ease: 2.5, interval: interval, due: Date.now() + interval * day, reps: reps, lapses: lapses };
  markStudied(new Date());
  save();
  return interval;
}
function posterRows() {
  const lessonId = session && session.lessonId ? session.lessonId : progress.lessonId;
  const pool = rows.filter((r) => r.section.id === lessonId);
  function rank(row) {
    const c = progress.cards[row.id];
    if (c && c.reps > 0 && c.interval <= 1) return 0;
    if (c && c.interval === 3) return 1;
    if (isFresh(c)) return 2;
    return 3;
  }
  return pool.slice().sort((a, b) => rank(a) - rank(b)).slice(0, 8);
}

});
