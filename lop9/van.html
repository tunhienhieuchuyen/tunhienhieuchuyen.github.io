<html lang="vi">

<meta name="mobile-web-app-capable" content="yes">

<script>
(function () {
  if (window.__lop9VanCapture) return;
  window.__lop9VanCapture = true;
  window.__lop9InstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();

    window.dispatchEvent(new CustomEvent("lop9:pwa-install-ready"));
  });
})();

<style>
  :root {
    --bg: #f3e0b8;
    --card: #fff6e2;
    --ink: #3b2a1a;
    --muted: #7a6148;
    --line: #e4d0a4;
    --accent: #8d4e16;
    --accent-fg: #fff6e4;
    --warn: #8a3b12;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #f3e0b8;
    color: var(--ink);
    font-family: "Be Vietnam Pro", "Noto Sans", Roboto, "Segoe UI", sans-serif;
    font-size: 1.075rem;
    line-height: 1.75;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; }
  #app { max-width: 36rem; margin: 0 auto; padding: 1.15rem 1.1rem 6.4rem; }
  h1 { font-size: 1.65rem; line-height: 1.35; margin: 0 0 .4rem; font-weight: 700; }
  h2 { font-size: 1.22rem; line-height: 1.4; margin: 0; font-weight: 700; }
  p { margin: .7rem 0; }
  .muted { color: var(--muted); }
  .sm { font-size: .98rem; }
  .tag { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .01em; color: var(--accent); }
  .note, .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1rem;
    padding: 1rem 1.05rem;
    margin: .85rem 0;
  }
  .warn { color: var(--warn); }
  .btn {
    min-height: 3rem; border-radius: .9rem; border: 1px solid var(--line);
    background: #fff8ea; padding: .65rem .85rem; font-weight: 700;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); width: 100%; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .row .btn { flex: 1; width: auto; }
  .hide { display: none; }
  ol.steps { margin: .4rem 0 .2rem 1.2rem; padding: 0; }
  ol.steps li { margin: .45rem 0; }
  .passage {
    background: #fff3d4;
    border-left: 4px solid #c4842a;
    border-radius: .4rem;
    padding: .8rem .95rem;
    margin: .6rem 0;
  }
  a { color: var(--accent); }
  label.tick { display: flex; gap: .55rem; align-items: flex-start; margin: .45rem 0; }
  textarea.box { width: 100%; min-height: 5.5rem; border-radius: .8rem; border: 1px solid var(--line); background: #fff8ea; color: var(--ink); padding: .6rem; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(255, 246, 226, .96);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .dock-in { max-width: 36rem; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
  .dock button { min-height: 4rem; border: 0; background: transparent; font-weight: 700; color: var(--muted); }
  .dock button.on { color: var(--accent); }
  #toasts { position: fixed; top: .7rem; right: .7rem; z-index: 100; display: flex; flex-direction: column; gap: .4rem; }
  .toast { background: #fff6e2; color: var(--ink); border-radius: .7rem; padding: .6rem .75rem; box-shadow: 0 8px 20px rgba(80, 50, 20, .12); border-left: 4px solid #c4842a; max-width: 17rem; }
  .toast.ok { border-left-color: #6b8f3c; }
  .toast.warn { border-left-color: #c45c1a; }
  .install-fab {
    position: fixed; z-index: 45; right: max(12px, env(safe-area-inset-right));
    bottom: calc(4.85rem + env(safe-area-inset-bottom));
    border: 0; background: transparent; padding: 6px; touch-action: none; display: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .install-fab, .install-fab * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .install-fab[data-positioned="1"] { right: auto; bottom: auto; }
  .install-fab-inner {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px;
    background: rgba(141, 78, 22, .94); color: #fff6e4; font-weight: 700; pointer-events: none;
    box-shadow: 0 10px 24px rgba(90, 50, 10, .25);
  }
  #pwa-guide { position: fixed; inset: 0; z-index: 95; background: rgba(59, 42, 26, .45); display: flex; align-items: flex-end; justify-content: center; padding: 1rem; }
  #pwa-guide[hidden] { display: none; }
  .pwa-card { width: min(24rem, 100%); background: #fff6e2; color: var(--ink); border-radius: 1.1rem; padding: 1rem; }
  .guide-step { display: flex; gap: .6rem; margin-top: .7rem; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<button class="install-fab" id="btnInstall" type="button" aria-label="Cài app văn">
  <span class="install-fab-inner">Cài app</span>
</button>
<div id="pwa-guide" hidden>
  <div class="pwa-card" role="dialog">
    <h2>Cài app văn</h2>
    <div id="pwa-guide-body"></div>
    <button class="btn" type="button" id="pwa-guide-close" style="margin-top:1rem">Đóng</button>
  </div>
</div>

  return '<button class="btn" type="button" data-back="1">Về danh sách</button><p class="tag" style="margin-top:.9rem">' + esc(u.bai) + "</p><h1>" + esc(u.title) + "</h1>" + u.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + (u.passage ? '<div class="passage"><p class="tag">Đoạn luyện, không có trong sách</p><p>' + esc(u.passage) + "</p></div>" : "") + (sort ? '<div class="card"><p class="tag">Tách chi tiết trước khi viết</p>' + sort + '<button class="btn btn-primary" type="button" data-sort-check="1" style="margin-top:.6rem">Kiểm tra cách tách</button><button class="btn" type="button" data-new-sort="1" style="margin-top:.4rem;width:100%">Bộ chi tiết khác</button></div>' : "") + quiz + (u.quizzes ? '<button class="btn" type="button" data-new-quiz="1">Bộ câu khác</button>' : "") + '<div class="card"><p class="tag">Vì sao cách này được điểm</p><p>' + esc(u.meo) + '</p><ol class="steps">' + u.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>" + alts + quote + '<div class="card"><p class="tag">Việc cần làm ra giấy</p><p>' + esc(u.practice.q) + '</p><button class="btn btn-primary" type="button" data-show="' + u.id + '">Đã viết xong, xem gợi ý</button><div class="' + (show ? "" : "hide") + '"><p class="sm"><b>Hướng đi.</b> ' + esc(u.practice.hint) + "</p><ol class=\"steps\">" + u.practice.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol><p><b>" + esc(u.practice.ans) + "</b></p></div></div>" + '<div class="card"><p class="tag">Bảng tự đối chiếu</p><p class="sm">Chỉ tick sau khi đã viết ra giấy và bấm Đã viết xong. Bảng này không đặt lịch ôn. Cô mới là người chấm.</p>' + crit.map(function (c, i) { return '<label class="tick"><input type="checkbox" data-tick="' + i + '"' + (show ? "" : " disabled") + (bag[i] ? " checked" : "") + "> <span>" + esc(c) + "</span></label>"; }).join("") + '<button class="btn" type="button" data-copy="1" style="width:100%;margin-top:.55rem">Hiện đoạn chữ để gửi cô hoặc bố mẹ</button><pre id="report-out" class="sm" style="white-space:pre-wrap"></pre></div>';
}
function render() {
  const root = document.getElementById("app");
  const u = openId && unitBy(openId);
  root.innerHTML = (u ? renderUnit(u) : (tab === "on" ? renderOn() : renderHome())) + '<nav class="dock"><div class="dock-in"><button type="button" data-tab="hoc" class="' + (tab === "hoc" && !openId ? "on" : "") + '">Học</button><button type="button" data-tab="on" class="' + (tab === "on" && !openId ? "on" : "") + '">Ôn</button></div></nav>';
}
document.body.addEventListener("click", function (ev) {
  const t = ev.target.closest("button");
  if (!t || t.id === "btnInstall" || t.id === "pwa-guide-close") return;
  const quoteBox = document.querySelector("[data-quote]");
  if (quoteBox && openId) {
    const all = quotes();
    all[openId] = quoteBox.value;
    localStorage.setItem("lop9-van-dan-chung", JSON.stringify(all));
  }
  if (t.dataset.tab) { tab = t.dataset.tab; openId = null; render(); return; }
  if (t.dataset.open) { openId = t.dataset.open; revealed = {}; prepareQuiz(unitBy(openId)); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.back) { openId = null; render(); return; }
  if (t.dataset.show) {
    revealed[t.dataset.show] = true;
    const row = prog[t.dataset.show] || {};
    row.wroteAt = Date.now();
    row.due = Date.now() + 3 * DAY;
    prog[t.dataset.show] = row;
    save();
    toast("Đã ghi ngày viết. Ba ngày nữa phần này vào Ôn. Lần sau viết bằng một đề khác.", "info");
    render();
    return;
  }
  if (t.dataset.side) { if (sortLocked[openId]) return; sortPick[openId + ":" + t.dataset.i] = t.dataset.side; render(); return; }
  if (t.dataset.newSort && openId) {
    sortSet[openId] = (sortSet[openId] || 0) + 1;
    sortLocked[openId] = false;
    sortMark[openId] = {};
    Object.keys(sortPick).forEach(function (k) { if (k.indexOf(openId + ":") === 0) delete sortPick[k]; });
    toast("Đã đổi bộ chi tiết. Lần chấm của bộ trước vẫn được giữ.", "info");
    render();
    return;
  }
  if (t.dataset.sortCheck && openId) {
    if (sortLocked[openId]) { toast("Bộ này đã chấm. Bấm Bộ chi tiết khác.", "info"); return; }
    const items = activeSort(unitBy(openId));
    const marks = {};
    let wrong = 0;
    items.forEach(function (item, i) {
      const pick = sortPick[openId + ":" + i];
      if (pick === item.side) marks[i] = "Đúng";
      else { wrong += 1; marks[i] = item.why; }
    });
    sortMark[openId] = marks;
    sortLocked[openId] = true;
    markSkill(openId, wrong === 0);
    toast(wrong ? "Có chi tiết chưa đúng cột. Lý do hiện ngay dưới chi tiết đó. Lần này đã được ghi." : "Tách đúng. Lần này đã được ghi.", wrong ? "warn" : "ok");
    render();
    return;
  }
  if (t.dataset.newQuiz && openId) {
    quizLocked[openId] = false;
    prepareQuiz(unitBy(openId), true);
    toast("Đã đổi bộ câu. Chấm xong bộ này thì Ôn mới cập nhật.", "info");
    render();
    return;
  }
  if (t.dataset.qa && openId) {
    if (quizLocked[openId]) return;
    const qi = t.dataset.qi;
    const items = quizOrder[openId] || [];
    const item = items[qi];
    if (!item) return;
    quizAns[openId] = quizAns[openId] || {};
    if (quizAns[openId][qi]) return;
    quizAns[openId][qi] = t.dataset.qa;
    const ok = t.dataset.qa === item.answer;
    const done = items.every(function (_, i) { return quizAns[openId][i]; });
    const allOk = done && items.every(function (q, i) { return quizAns[openId][i] === q.answer; });
    if (done) { quizLocked[openId] = true; markSkill(openId, allOk); }
    toast(ok ? "Đúng. " + item.why : "Chưa phải. " + item.why, ok ? "ok" : "warn");
    render();
    return;
  }
  if (t.dataset.copy && openId) {
    const u = unitBy(openId);
    const note = (quotes()[openId] || "").trim();
    const bag = ticks()[openId] || {};
    const crit = criteriaOf(u);
    const lines = crit.map(function (c, i) { return (bag[i] ? "[x] " : "[ ] ") + c; }).join("\n");
    const text = "Bài văn lớp 9\nPhần: " + u.title + "\nChụp bài giấy gửi cô qua Zalo.\nBảng tick:\n" + lines + "\nDẫn chứng em chép: " + (note || "(chưa ghi)");
    const out = document.getElementById("report-out");
    if (out) out.textContent = text;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("Đã sao chép. Gửi cô hoặc bố mẹ.", "ok"); }).catch(function () { toast("Nhấn giữ đoạn chữ vừa hiện để sao chép.", "warn"); });
    else toast("Nhấn giữ đoạn chữ vừa hiện để sao chép.", "info");
  }
});
document.body.addEventListener("change", function (ev) {
  if (ev.target.dataset.tick != null && openId) {
    const all = ticks();
    const bag = all[openId] || {};
    bag[ev.target.dataset.tick] = ev.target.checked;
    all[openId] = bag;
    if (!revealed[openId]) { ev.target.checked = false; toast("Viết ra giấy và bấm Đã viết xong, rồi mới tick.", "info"); return; }
    localStorage.setItem("lop9-van-tieu-chi", JSON.stringify(all));
    const n = Object.keys(bag).filter(function (k) { return bag[k]; }).length;
    toast(n + " ý đã tick. Bảng này không thay cô chấm.", "info");
  }
  if (ev.target.dataset.quote && openId) {
    const all = quotes();
    all[openId] = ev.target.value;
    localStorage.setItem("lop9-van-dan-chung", JSON.stringify(all));
  }
});
render();
</script>
<script>
(function () {
  var FAB = "lop9_van_fab_v1";
  var fab = document.getElementById("btnInstall");
  var guide = document.getElementById("pwa-guide");
  var box = document.getElementById("pwa-guide-body");
  var ua = navigator.userAgent.toLowerCase();
  var phone = /iphone|ipad|ipod|android/.test(ua) || navigator.maxTouchPoints > 1;
  var ios = /iphone|ipad|ipod/.test(ua);
  var zalo = /zalo|fban|fbav|instagram/.test(ua);
  var alone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  function showGuide() {
    box.innerHTML = zalo ? "<p>Zalo đang chặn cài app. Bấm ⋯ rồi chọn Mở bằng trình duyệt.</p>" : (ios ? "<p>Trên iPhone, bấm Chia sẻ rồi chọn Thêm vào Màn hình chính.</p>" : (phone ? "<p>Trên Android, bấm ⋮ rồi chọn Cài đặt ứng dụng.</p>" : "<p>Trên máy tính, dùng Chrome hoặc Edge và bấm biểu tượng cài ở thanh địa chỉ.</p>"));
    guide.hidden = false;
  }
  function install() {
    var promptEvent = window.__lop9InstallPrompt;
    if (promptEvent && promptEvent.prompt) {
      window.__lop9InstallPrompt = null;
      promptEvent.prompt().then(function () { return promptEvent.userChoice; }).then(function (choice) {
        if (choice && choice.outcome === "accepted") fab.style.display = "none";
      }).catch(showGuide);
      return;
    }
    showGuide();
  }
  var pointer = null, drag = false, sx = 0, sy = 0, sl = 0, st = 0;
  function place(left, top) {
    var rect = fab.getBoundingClientRect();
    left = Math.min(Math.max(8, left), Math.max(8, window.innerWidth - rect.width - 8));
    top = Math.min(Math.max(8, top), Math.max(8, window.innerHeight - rect.height - 8));
    fab.style.left = left + "px"; fab.style.top = top + "px"; fab.style.right = "auto"; fab.style.bottom = "auto";
    fab.dataset.positioned = "1";
    return { left: left, top: top };
  }
  try { var saved = JSON.parse(localStorage.getItem(FAB) || "null"); if (saved) place(saved.left, saved.top); } catch (e) {}
  fab.addEventListener("pointerdown", function (ev) {
    if (ev.button && ev.button !== 0) return;
    ev.preventDefault();
    pointer = ev.pointerId; drag = false; sx = ev.clientX; sy = ev.clientY;
    var rect = fab.getBoundingClientRect(); sl = rect.left; st = rect.top;
    if (fab.setPointerCapture) fab.setPointerCapture(ev.pointerId);
  }, { passive: false });
  fab.addEventListener("pointermove", function (ev) {
    if (ev.pointerId !== pointer) return;
    ev.preventDefault();
    var dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!drag && Math.hypot(dx, dy) > 10) drag = true;
    if (drag) place(sl + dx, st + dy);
  }, { passive: false });
  fab.addEventListener("pointerup", function (ev) {
    if (ev.pointerId !== pointer) return;
    if (drag) { var pos = place(fab.getBoundingClientRect().left, fab.getBoundingClientRect().top); localStorage.setItem(FAB, JSON.stringify(pos)); toast("Đã dời nút Cài app.", "info"); }
    else install();
    pointer = null; drag = false;
  });
  fab.addEventListener("click", function (ev) { ev.preventDefault(); });
  fab.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  document.getElementById("pwa-guide-close").addEventListener("click", function () { guide.hidden = true; });
  window.addEventListener("appinstalled", function () { fab.style.display = "none"; });
  window.addEventListener("lop9:pwa-install-ready", function () { if (!alone) fab.style.display = "block"; });
  if (!alone) fab.style.display = "block";
  if ("serviceWorker" in navigator && /^https?:$/i.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" }).catch(function () {});
    });
  }
})();
</script>
